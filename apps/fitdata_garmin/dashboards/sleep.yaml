spec: easy-ui/v1
title: Sleep and recovery
description: >-
  How long and how well you slept, and how your body recovered: overnight HRV, resting heart
  rate and Body Battery. Each night is shown on the date you woke up.

params:
  days:
    type: choice
    label: Days
    default: 30
    options:
      - {value: 7, label: 7 days}
      - {value: 30, label: 30 days}
      - {value: 90, label: 90 days}
      - {value: 365, label: 365 days}

queries:
  # Averages over the period, and the change against the same number of days before it.
  # Nights without a reading are left out of both averages.
  summary:
    sql: |
      WITH end_day AS (
        SELECT max(date) AS d FROM days WHERE has_data = 1
      ),
      nights AS (
        SELECT CASE WHEN date > date(e.d, '-' || :days || ' days') THEN 1 ELSE 0 END AS recent,
               nullif(sleep_seconds, 0) AS sleep_s,
               sleep_score, hrv_last_night_avg AS hrv, resting_hr
        FROM days, end_day e
        WHERE has_data = 1
          AND date > date(e.d, '-' || (2 * :days) || ' days') AND date <= e.d
      )
      SELECT
        round(avg(CASE WHEN recent = 1 THEN sleep_s END) / 60) * 60 AS sleep,
        round((avg(CASE WHEN recent = 1 THEN sleep_s END) - avg(CASE WHEN recent = 0 THEN sleep_s END)) / 60) * 60
          AS sleep_change,
        avg(CASE WHEN recent = 1 THEN sleep_score END) AS score,
        avg(CASE WHEN recent = 1 THEN sleep_score END) - avg(CASE WHEN recent = 0 THEN sleep_score END)
          AS score_change,
        avg(CASE WHEN recent = 1 THEN hrv END) AS hrv,
        avg(CASE WHEN recent = 1 THEN hrv END) - avg(CASE WHEN recent = 0 THEN hrv END) AS hrv_change,
        avg(CASE WHEN recent = 1 THEN resting_hr END) AS resting_hr,
        avg(CASE WHEN recent = 1 THEN resting_hr END) - avg(CASE WHEN recent = 0 THEN resting_hr END)
          AS resting_hr_change
      FROM nights

  # One row per day in the period, with 7-day averages next to HRV and resting heart rate.
  nightly:
    sql: |
      WITH end_day AS (
        SELECT max(date) AS d FROM days WHERE has_data = 1
      ),
      rolled AS (
        SELECT date, nullif(sleep_seconds, 0) AS sleep_s, sleep_score,
               hrv_last_night_avg AS hrv, resting_hr, body_battery_high, body_battery_low,
               avg(hrv_last_night_avg) OVER w AS hrv_7d,
               avg(resting_hr) OVER w AS rhr_7d
        FROM days
        WINDOW w AS (ORDER BY julianday(date) RANGE BETWEEN 6 PRECEDING AND CURRENT ROW)
      )
      SELECT r.date AS day,
             round(r.sleep_s / 3600.0, 2) AS "Hours asleep",
             r.sleep_score AS "Sleep score",
             r.hrv AS "Overnight HRV",
             round(r.hrv_7d, 1) AS "HRV, 7-day average",
             r.resting_hr AS "Resting heart rate",
             round(r.rhr_7d, 1) AS "Resting heart rate, 7-day average",
             r.body_battery_high AS "Highest",
             r.body_battery_low AS "Lowest"
      FROM rolled r, end_day e
      WHERE r.date > date(e.d, '-' || :days || ' days') AND r.date <= e.d
      ORDER BY r.date

  # The most recent nights first.
  last_nights:
    sql: |
      WITH end_day AS (
        SELECT max(date) AS d FROM days WHERE has_data = 1
      )
      SELECT date AS day,
             nullif(sleep_seconds, 0) AS sleep_s,
             sleep_score,
             hrv_last_night_avg AS hrv,
             upper(substr(hrv_status, 1, 1)) || lower(substr(hrv_status, 2)) AS hrv_status,
             resting_hr,
             body_battery_high,
             training_readiness
      FROM days, end_day e
      WHERE has_data = 1
        AND date > date(e.d, '-' || :days || ' days') AND date <= e.d
      ORDER BY date DESC

layout:
  - - type: controls

  - - type: stat
      title: Time asleep
      query: summary
      value: sleep
      format: duration
      delta: sleep_change
      better: higher
      hint: Average per night in hours and minutes, against the same number of days before.
    - type: stat
      title: Sleep score
      query: summary
      value: score
      format: integer
      delta: score_change
      better: higher
      delta_format: decimal1
      hint: Average out of 100, against the same number of days before.
    - type: stat
      title: Overnight HRV
      query: summary
      value: hrv
      format: integer
      delta: hrv_change
      better: higher
      delta_format: decimal1
      hint: Average in milliseconds. Higher than your usual is generally a good sign.
    - type: stat
      title: Resting heart rate
      query: summary
      value: resting_hr
      format: decimal1
      delta: resting_hr_change
      better: lower
      hint: Average beats per minute. A rise of a few beats can mean stress, illness or hard training.

  - - type: bar
      title: Time asleep
      query: nightly
      x: day
      y: Hours asleep
      format: decimal1
      unit: h
    - type: line
      title: Sleep score
      query: nightly
      x: day
      y: Sleep score
      format: integer

  - - type: line
      title: Overnight HRV
      query: nightly
      x: day
      y: ["Overnight HRV", "HRV, 7-day average"]
      format: integer
      unit: ms
    - type: line
      title: Resting heart rate
      query: nightly
      x: day
      y: ["Resting heart rate", "Resting heart rate, 7-day average"]
      format: integer
      unit: bpm

  - - type: line
      title: Body Battery, highest and lowest of each day
      query: nightly
      x: day
      y: [Highest, Lowest]
      format: integer

  - - type: table
      title: Last nights
      query: last_nights
      limit: 14
      columns:
        - {column: day, label: Woke up on, format: date}
        - {column: sleep_s, label: Time asleep, format: duration}
        - {column: sleep_score, label: Sleep score, format: integer}
        - {column: hrv, label: HRV (ms), format: integer}
        - {column: hrv_status, label: HRV status}
        - {column: resting_hr, label: Resting HR (bpm), format: integer}
        - {column: body_battery_high, label: Body Battery high, format: integer}
        - {column: training_readiness, label: Readiness, format: integer}

  - - type: text
      body: |
        A dash means the watch has no reading for that night, for example when it was not worn
        or was charging. Such nights are left out of the averages.

        Sleep score, HRV status, Body Battery and Training Readiness are **Garmin's own
        calculations**. Look at the 7-day averages and the trend over weeks rather than at a
        single night.
