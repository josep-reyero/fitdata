spec: easy-ui/sections-v1
# fitdata-garmin's part of the project's Today page (ui/dashboards/overview.yaml): the headline
# readings and the night and the day hour by hour, placed at its anchors. Query names start with
# garmin_, this app's table prefix; the queries use the page's own "day" control (the day shown is
# that day, or the most recent day with data when it is later). To change what this adds to the
# page without editing the app, a project can put its own version in
# ui/sections/fitdata-garmin.overview.yaml.
sections:
  - id: garmin-readings
    position: after:readings
    queries:
      # The shown day's readings, each with its change against your usual: the average of the days
      # before it (up to 28) that have a reading. With fewer than 3 such days there is no usual yet,
      # so no change is shown. The *_word columns are the short line under each figure.
      garmin_today:
        sql: |
          WITH sel AS (
            SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
          ),
          usual AS (
            SELECT avg(x.training_readiness) AS ready, count(x.training_readiness) AS n_ready,
                   avg(x.sleep_score) AS score, count(x.sleep_score) AS n_score,
                   avg(nullif(x.sleep_seconds, 0)) AS asleep, count(nullif(x.sleep_seconds, 0)) AS n_asleep,
                   avg(x.hrv_last_night_avg) AS hrv, count(x.hrv_last_night_avg) AS n_hrv,
                   avg(x.resting_hr) AS rhr, count(x.resting_hr) AS n_rhr,
                   avg(x.stress_avg) AS stress, count(x.stress_avg) AS n_stress
            FROM days x, sel
            WHERE x.has_data = 1 AND x.date >= date(sel.d, '-28 days') AND x.date < sel.d
          )
          SELECT d.training_readiness AS ready,
                 CASE WHEN u.n_ready >= 3 THEN d.training_readiness - u.ready END AS ready_change,
                 upper(substr(t.readiness_level, 1, 1)) || lower(substr(t.readiness_level, 2)) AS ready_word,
                 d.sleep_score AS score, CASE WHEN u.n_score >= 3 THEN d.sleep_score - u.score END AS score_change,
                 upper(substr(s.quality, 1, 1)) || lower(substr(s.quality, 2)) AS score_word,
                 nullif(d.sleep_seconds, 0) AS asleep,
                 CASE WHEN u.n_asleep >= 3 THEN round((nullif(d.sleep_seconds, 0) - u.asleep) / 60) * 60 END AS asleep_change,
                 CASE WHEN s.need_minutes IS NOT NULL
                      THEN printf('Need %d h %02d', s.need_minutes / 60, s.need_minutes % 60) END AS asleep_word,
                 d.hrv_last_night_avg AS hrv, CASE WHEN u.n_hrv >= 3 THEN d.hrv_last_night_avg - u.hrv END AS hrv_change,
                 CASE WHEN d.hrv_last_night_avg IS NULL THEN NULL
                      WHEN d.hrv_status IS NULL OR upper(d.hrv_status) = 'NONE' THEN 'No baseline yet'
                      ELSE upper(substr(d.hrv_status, 1, 1)) || lower(substr(replace(d.hrv_status, '_', ' '), 2)) END AS hrv_word,
                 d.resting_hr AS rhr, CASE WHEN u.n_rhr >= 3 THEN d.resting_hr - u.rhr END AS rhr_change,
                 CASE WHEN d.resting_hr IS NOT NULL THEN 'Beats per minute' END AS rhr_word,
                 g.body_battery_latest AS bb,
                 CASE WHEN g.body_battery_at_wake IS NOT NULL THEN printf('Woke up with %d', g.body_battery_at_wake) END AS bb_word,
                 d.stress_avg AS stress, CASE WHEN u.n_stress >= 3 THEN d.stress_avg - u.stress END AS stress_change,
                 CASE WHEN d.stress_avg IS NULL THEN NULL WHEN d.stress_avg <= 25 THEN 'Resting'
                      WHEN d.stress_avg <= 50 THEN 'Low' WHEN d.stress_avg <= 75 THEN 'Medium' ELSE 'High' END AS stress_word,
                 nullif(d.steps, 0) AS steps, nullif(d.steps, 0) - d.steps_goal AS steps_vs_goal,
                 CASE WHEN d.steps_goal IS NOT NULL THEN printf('Goal %,d', d.steps_goal) END AS steps_word
          FROM sel LEFT JOIN days d ON d.date = sel.d AND d.has_data = 1
               LEFT JOIN garmin_daily g ON g.date = sel.d LEFT JOIN garmin_sleep s ON s.date = sel.d
               LEFT JOIN garmin_training t ON t.date = sel.d, usual u
    layout:
      # The night ...
      - - type: stat
          title: Sleep score
          class: sleep
          query: garmin_today
          value: score
          format: integer
          delta: score_change
          delta_format: integer
          better: higher
          note: score_word
        - type: stat
          title: Time asleep
          class: [sleep, duration]
          query: garmin_today
          value: asleep
          format: duration
          delta: asleep_change
          better: higher
          note: asleep_word
        - type: stat
          title: Overnight HRV (ms)
          class: heart
          query: garmin_today
          value: hrv
          format: integer
          delta: hrv_change
          delta_format: integer
          better: higher
          note: hrv_word
        - type: stat
          title: Resting heart rate
          class: heart
          query: garmin_today
          value: rhr
          format: integer
          delta: rhr_change
          delta_format: decimal1
          better: lower
          note: rhr_word

      # ... and the day.
      - - type: stat
          title: Training readiness
          id: today-readiness
          class: training
          query: garmin_today
          value: ready
          format: integer
          delta: ready_change
          delta_format: integer
          better: higher
          note: ready_word
        - type: stat
          title: Body Battery
          class: energy
          query: garmin_today
          value: bb
          format: integer
          note: bb_word
        - type: stat
          title: Average stress
          class: stress
          query: garmin_today
          value: stress
          format: integer
          delta: stress_change
          delta_format: integer
          better: lower
          note: stress_word
        - type: stat
          title: Steps
          class: activity
          query: garmin_today
          value: steps
          format: integer
          delta: steps_vs_goal
          better: higher
          note: steps_word

  - id: garmin-charts
    position: after:charts
    queries:
      # The night that ended on the shown day, stage by stage (kept for the most recent weeks).
      garmin_night:
        sql: |
          WITH sel AS (
            SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
          )
          SELECT g.start, g.until,
                 CASE g.stage WHEN 'deep' THEN 'Deep' WHEN 'light' THEN 'Light' WHEN 'rem' THEN 'REM'
                              WHEN 'awake' THEN 'Awake' ELSE g.stage END AS stage
          FROM garmin_sleep_stages g, sel
          WHERE g.date = sel.d
          ORDER BY g.start

      # Stress and Body Battery through the shown day (stress.json measures both every 3 minutes).
      garmin_day_energy:
        sql: |
          WITH sel AS (
            SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
          )
          SELECT substr(s.at, 12, 5) AS time,
                 max(CASE WHEN s.series = 'body_battery' THEN s.value END) AS "Body Battery",
                 max(CASE WHEN s.series = 'stress' THEN s.value END) AS "Stress"
          FROM garmin_samples s, sel
          WHERE s.date = sel.d AND s.series IN ('body_battery', 'stress')
          GROUP BY s.at
          ORDER BY s.at

      garmin_day_heart:
        sql: |
          WITH sel AS (
            SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
          )
          SELECT substr(s.at, 12, 5) AS time, s.value AS "Heart rate"
          FROM garmin_samples s, sel
          WHERE s.date = sel.d AND s.series = 'heart_rate'
          ORDER BY s.at
    layout:
      - - type: timeline
          title: Last night
          id: today-night
          class: [sleep, hypnogram]
          query: garmin_night
          start: start
          end: until
          category: stage
          order: [Awake, REM, Light, Deep]
          hide_empty: true
        - type: line
          title: Body Battery and stress
          id: today-energy
          class: [energy, pair-energy-stress]
          query: garmin_day_energy
          x: time
          y: ["Body Battery", "Stress"]
          format: integer
          step: 25
          hide_empty: true
        - type: line
          title: Heart rate
          id: today-heart
          class: heart
          query: garmin_day_heart
          x: time
          y: Heart rate
          format: integer
          unit: bpm
          hide_empty: true

      - - type: text
          class: notes
          body: |
            Arrows compare with **your usual**, the average of up to 28 earlier days (once there
            are 3). Scores are Garmin's own.
