spec: easy-ui/sections-v1
# fitdata-garmin's part of the project's Today page (ui/dashboards/overview.yaml): the Garmin
# readings, placed at its anchors. Query names start with garmin_, this app's table prefix; the
# queries use the page's own "days" control. To change what this adds to the page without editing
# the app, a project can put its own version in ui/sections/fitdata-garmin.overview.yaml.
sections:
  - id: garmin-readings
    position: after:readings
    queries:
      # For each measure: its latest value within the period, and that value minus the average of
      # the same number of days before it. A day without a reading is skipped, never counted as 0.
      garmin_latest:
        sql: |
          WITH end_day AS (
            SELECT max(date) AS d FROM days WHERE has_data = 1
          ),
          readings AS (
            -- Steps: the last full day, since the latest day is usually still in progress.
            SELECT date, 'steps' AS metric, nullif(steps, 0) AS v FROM days, end_day e
            WHERE has_data = 1 AND date < e.d
            UNION ALL SELECT date, 'resting_hr', resting_hr FROM days WHERE has_data = 1
            UNION ALL SELECT date, 'sleep_score', sleep_score FROM days WHERE has_data = 1
            UNION ALL SELECT date, 'hrv', hrv_last_night_avg FROM days WHERE has_data = 1
            UNION ALL SELECT date, 'body_battery', body_battery_high FROM days WHERE has_data = 1
            UNION ALL SELECT date, 'readiness', training_readiness FROM days WHERE has_data = 1
          ),
          latest AS (
            SELECT metric, date, v FROM (
              SELECT r.metric, r.date, r.v,
                     row_number() OVER (PARTITION BY r.metric ORDER BY r.date DESC) AS n
              FROM readings r, end_day e
              WHERE r.v IS NOT NULL AND r.date > date(e.d, '-' || :days || ' days') AND r.date <= e.d
            ) WHERE n = 1
          ),
          earlier AS (
            SELECT l.metric, avg(r.v) AS v
            FROM latest l JOIN readings r ON r.metric = l.metric
            WHERE r.v IS NOT NULL AND r.date < l.date AND r.date >= date(l.date, '-' || :days || ' days')
            GROUP BY l.metric
          )
          SELECT
            max(CASE WHEN l.metric = 'steps' THEN l.v END) AS steps,
            max(CASE WHEN l.metric = 'steps' THEN l.v - b.v END) AS steps_change,
            max(CASE WHEN l.metric = 'resting_hr' THEN l.v END) AS resting_hr,
            max(CASE WHEN l.metric = 'resting_hr' THEN l.v - b.v END) AS resting_hr_change,
            max(CASE WHEN l.metric = 'sleep_score' THEN l.v END) AS sleep_score,
            max(CASE WHEN l.metric = 'sleep_score' THEN l.v - b.v END) AS sleep_score_change,
            max(CASE WHEN l.metric = 'hrv' THEN l.v END) AS hrv,
            max(CASE WHEN l.metric = 'hrv' THEN l.v - b.v END) AS hrv_change,
            max(CASE WHEN l.metric = 'body_battery' THEN l.v END) AS body_battery,
            max(CASE WHEN l.metric = 'body_battery' THEN l.v - b.v END) AS body_battery_change,
            max(CASE WHEN l.metric = 'readiness' THEN l.v END) AS readiness,
            max(CASE WHEN l.metric = 'readiness' THEN l.v - b.v END) AS readiness_change
          FROM latest l LEFT JOIN earlier b ON b.metric = l.metric
    layout:
      - - type: stat
          title: Steps
          query: garmin_latest
          value: steps
          format: integer
          delta: steps_change
          better: higher
          hint: The last full day (the one before the latest sync), against your daily average before it.
        - type: stat
          title: Resting heart rate
          query: garmin_latest
          value: resting_hr
          format: integer
          delta: resting_hr_change
          better: lower
          delta_format: decimal1
          hint: Beats per minute. Lower than usual often means you are well rested.
        - type: stat
          title: Sleep score
          query: garmin_latest
          value: sleep_score
          format: integer
          delta: sleep_score_change
          better: higher
          delta_format: decimal1
          hint: Last night, out of 100, against your average for the nights before.
        - type: stat
          title: Overnight HRV
          query: garmin_latest
          value: hrv
          format: integer
          delta: hrv_change
          better: higher
          delta_format: decimal1
          hint: Heart rate variability in milliseconds. Compare it with your own usual, not with others.

      - - type: stat
          title: Body Battery high
          query: garmin_latest
          value: body_battery
          format: integer
          delta: body_battery_change
          better: higher
          delta_format: decimal1
          hint: The highest your energy reserve reached that day, out of 100.
        - type: stat
          title: Training readiness
          query: garmin_latest
          value: readiness
          format: integer
          delta: readiness_change
          better: higher
          delta_format: decimal1
          hint: Out of 100. How ready Garmin thinks you are for a hard session.

  - id: garmin-trends
    position: after:trends
    queries:
      # One row per day in the period, with a 7-day average next to the noisier measures.
      garmin_daily:
        sql: |
          WITH end_day AS (
            SELECT max(date) AS d FROM days WHERE has_data = 1
          ),
          rolled AS (
            SELECT date,
                   sleep_score, resting_hr, hrv_last_night_avg AS hrv, nullif(steps, 0) AS steps,
                   avg(sleep_score) OVER w AS sleep_7d,
                   avg(resting_hr) OVER w AS rhr_7d,
                   avg(hrv_last_night_avg) OVER w AS hrv_7d
            FROM days
            WINDOW w AS (ORDER BY julianday(date) RANGE BETWEEN 6 PRECEDING AND CURRENT ROW)
          )
          SELECT r.date AS day,
                 r.sleep_score AS "Sleep score",
                 round(r.sleep_7d, 1) AS "Sleep score, 7-day average",
                 r.resting_hr AS "Resting heart rate",
                 round(r.rhr_7d, 1) AS "Resting heart rate, 7-day average",
                 r.hrv AS "Overnight HRV",
                 round(r.hrv_7d, 1) AS "Overnight HRV, 7-day average",
                 -- The latest day is usually still in progress, so its steps are left out (like the Steps number).
                 CASE WHEN r.date < e.d THEN r.steps END AS "Steps"
          FROM rolled r, end_day e
          WHERE r.date > date(e.d, '-' || :days || ' days') AND r.date <= e.d
          ORDER BY r.date
    layout:
      - - type: line
          title: Sleep score
          query: garmin_daily
          x: day
          y: ["Sleep score", "Sleep score, 7-day average"]
          format: integer
        - type: line
          title: Resting heart rate
          query: garmin_daily
          x: day
          y: ["Resting heart rate", "Resting heart rate, 7-day average"]
          format: integer
          unit: bpm

      - - type: line
          title: Overnight HRV
          query: garmin_daily
          x: day
          y: ["Overnight HRV", "Overnight HRV, 7-day average"]
          format: integer
          unit: ms
        - type: bar
          title: Steps per day
          query: garmin_daily
          x: day
          y: Steps
          format: integer

      - - type: text
          body: |
            Each small number next to a reading is the change against your average over the same
            number of days before it. Days the watch did not record are left out, never counted as
            zero, so gaps in the charts are days without a reading.

            Sleep score, HRV, Body Battery and Training Readiness are **Garmin's own calculations**.
            A trend over a few weeks tells you more than a single day.
