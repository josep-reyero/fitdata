spec: easy-ui/v1
title: Trends
description: >-
  The long view: weekly averages of your recovery, sleep, daily movement and training, so slow
  changes stand out from day-to-day noise.

params:
  days:
    type: choice
    label: Days
    default: 365
    options:
      - {value: 7, label: 7 days}
      - {value: 30, label: 30 days}
      - {value: 90, label: 90 days}
      - {value: 365, label: 365 days}

queries:
  # One row per week (Monday to Sunday). Days without a reading are left out of each average.
  health:
    sql: |
      WITH RECURSIVE end_day AS (
        SELECT max(date) AS d FROM days WHERE has_data = 1
      ),
      weeks(week) AS (
        -- From the first week of the period, or of the archive when it starts later.
        SELECT date(max(date(e.d, '-' || (:days - 1) || ' days'),
                        (SELECT min(date) FROM days WHERE has_data = 1)), 'weekday 0', '-6 days')
        FROM end_day e
        UNION ALL
        SELECT date(week, '+7 days') FROM weeks, end_day e WHERE date(week, '+7 days') <= e.d
      ),
      d AS (
        SELECT date(date, 'weekday 0', '-6 days') AS week,
               resting_hr, hrv_last_night_avg AS hrv, sleep_score,
               nullif(sleep_seconds, 0) AS sleep_s,
               -- The latest day is usually still in progress, so its steps are left out.
               CASE WHEN date < e.d THEN nullif(steps, 0) END AS steps,
               body_battery_high, training_readiness, vo2max_running
        FROM days, end_day e
        WHERE has_data = 1 AND date > date(e.d, '-' || :days || ' days') AND date <= e.d
      )
      SELECT w.week AS week,
             round(avg(d.resting_hr), 1) AS "Resting heart rate",
             round(avg(d.hrv), 1) AS "Overnight HRV",
             round(avg(d.sleep_score), 1) AS "Sleep score",
             round(avg(d.sleep_s) / 3600, 2) AS "Hours asleep",
             round(avg(d.steps)) AS "Steps per day",
             round(avg(d.body_battery_high), 1) AS "Body Battery high",
             round(avg(d.training_readiness), 1) AS "Training readiness",
             max(d.vo2max_running) AS "VO2 max"
      FROM weeks w LEFT JOIN d ON d.week = w.week
      GROUP BY w.week
      ORDER BY w.week

  # Training per week: time and Garmin's training load from all activities.
  training:
    sql: |
      WITH RECURSIVE end_day AS (
        SELECT max(d) AS d FROM (
          SELECT max(date) AS d FROM days WHERE has_data = 1
          UNION ALL SELECT max(date) FROM activities
        )
      ),
      weeks(week) AS (
        -- From the first week of the period, or of the archive when it starts later.
        SELECT date(max(date(e.d, '-' || (:days - 1) || ' days'),
                        (SELECT min(date) FROM days WHERE has_data = 1)), 'weekday 0', '-6 days')
        FROM end_day e
        UNION ALL
        SELECT date(week, '+7 days') FROM weeks, end_day e WHERE date(week, '+7 days') <= e.d
      ),
      a AS (
        SELECT date(date, 'weekday 0', '-6 days') AS week, duration_s, training_load
        FROM activities, end_day e
        WHERE date > date(e.d, '-' || :days || ' days') AND date <= e.d
      )
      SELECT w.week AS week,
             round(total(a.duration_s) / 3600, 1) AS "Hours of activity",
             round(total(a.training_load)) AS "Training load"
      FROM weeks w LEFT JOIN a ON a.week = w.week
      GROUP BY w.week
      ORDER BY w.week

layout:
  - - type: controls

  - - type: line
      title: Resting heart rate, weekly average
      query: health
      x: week
      y: Resting heart rate
      format: decimal1
      unit: bpm
    - type: line
      title: Overnight HRV, weekly average
      query: health
      x: week
      y: Overnight HRV
      format: decimal1
      unit: ms

  - - type: line
      title: Sleep score, weekly average
      query: health
      x: week
      y: Sleep score
      format: decimal1
    - type: bar
      title: Time asleep, weekly average per night
      query: health
      x: week
      y: Hours asleep
      format: decimal1
      unit: h

  - - type: bar
      title: Steps per day, weekly average
      query: health
      x: week
      y: Steps per day
      format: integer
    - type: line
      title: Body Battery and readiness, weekly average
      query: health
      x: week
      y: ["Body Battery high", "Training readiness"]
      format: decimal1

  - - type: bar
      title: Hours of activity per week
      query: training
      x: week
      y: Hours of activity
      format: decimal1
      unit: h
    - type: bar
      title: Training load per week
      query: training
      x: week
      y: Training load
      format: integer
    - type: line
      title: VO2 max (running)
      query: health
      x: week
      y: VO2 max
      format: decimal1

  - - type: text
      body: |
        Each point is one week, Monday to Sunday. The first and the latest week may be only
        partly covered. Weeks without readings show as gaps, never as zero.

        VO2 max, training load, Body Battery and Training Readiness are **Garmin's own
        calculations**. VO2 max only updates after outdoor runs, so some weeks have none.
