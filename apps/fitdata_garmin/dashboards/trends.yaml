spec: easy-ui/v1
title: Trends
description: >-
  The long view of any measure, day by day or as weekly or monthly averages with the lowest and
  highest day, next to a second measure, so slow changes stand out from day-to-day noise.

params:
  metric:
    type: choice
    label: Measure
    default: resting_hr
    options:
      - {value: resting_hr, label: "Resting heart rate (bpm)"}
      - {value: hrv, label: "Overnight HRV (ms)"}
      - {value: sleep_score, label: "Sleep score"}
      - {value: sleep_hours, label: "Time asleep (hours)"}
      - {value: deep_hours, label: "Deep sleep (hours)"}
      - {value: rem_hours, label: "REM sleep (hours)"}
      - {value: sleep_hr, label: "Heart rate asleep (bpm)"}
      - {value: breathing, label: "Breathing asleep (per minute)"}
      - {value: spo2, label: "Blood oxygen asleep (%)"}
      - {value: skin_temp, label: "Skin temperature change (°C)"}
      - {value: stress, label: "Average stress"}
      - {value: rest_hours, label: "Time at rest (hours)"}
      - {value: bb_wake, label: "Body Battery at wake"}
      - {value: bb_high, label: "Body Battery, highest"}
      - {value: readiness, label: "Training readiness"}
      - {value: steps, label: "Steps"}
      - {value: intensity, label: "Intensity minutes"}
      - {value: active_kcal, label: "Active calories"}
      - {value: floors, label: "Floors climbed"}
      - {value: acute_load, label: "Acute training load"}
      - {value: vo2max, label: "VO2 max (running)"}
      - {value: endurance, label: "Endurance score"}
      - {value: weight, label: "Weight (kg)"}
      - {value: fitness_age, label: "Fitness age (years)"}
  compare:
    type: choice
    label: Next to
    default: hrv
    options:
      - {value: resting_hr, label: "Resting heart rate (bpm)"}
      - {value: hrv, label: "Overnight HRV (ms)"}
      - {value: sleep_score, label: "Sleep score"}
      - {value: sleep_hours, label: "Time asleep (hours)"}
      - {value: deep_hours, label: "Deep sleep (hours)"}
      - {value: rem_hours, label: "REM sleep (hours)"}
      - {value: sleep_hr, label: "Heart rate asleep (bpm)"}
      - {value: breathing, label: "Breathing asleep (per minute)"}
      - {value: spo2, label: "Blood oxygen asleep (%)"}
      - {value: skin_temp, label: "Skin temperature change (°C)"}
      - {value: stress, label: "Average stress"}
      - {value: rest_hours, label: "Time at rest (hours)"}
      - {value: bb_wake, label: "Body Battery at wake"}
      - {value: bb_high, label: "Body Battery, highest"}
      - {value: readiness, label: "Training readiness"}
      - {value: steps, label: "Steps"}
      - {value: intensity, label: "Intensity minutes"}
      - {value: active_kcal, label: "Active calories"}
      - {value: floors, label: "Floors climbed"}
      - {value: acute_load, label: "Acute training load"}
      - {value: vo2max, label: "VO2 max (running)"}
      - {value: endurance, label: "Endurance score"}
      - {value: weight, label: "Weight (kg)"}
      - {value: fitness_age, label: "Fitness age (years)"}
  grain:
    type: choice
    label: Show
    default: day
    options:
      - {value: day, label: Each day}
      - {value: week, label: Week averages}
      - {value: month, label: Month averages}
  days:
    type: choice
    label: Over
    default: 90
    options:
      - {value: 90, label: 90 days}
      - {value: 365, label: 1 year}
      - {value: 1095, label: 3 years}
      - {value: 36500, label: Everything}

queries:
  # The chosen measure and the one next to it, per day, week (Monday to Sunday) or month: the
  # average, the lowest and highest day (the shaded band) and how many days had a reading. Days
  # without one are left out, never counted as 0; the archive's latest day (usually still in
  # progress) is left out of steps, intensity, calories and floors.
  periods:
    sql: |
      WITH r AS (SELECT (SELECT max(date) FROM days WHERE has_data = 1) AS latest),
      base AS (
        SELECT d.date AS date, d.resting_hr, d.hrv_last_night_avg, d.sleep_score, d.sleep_seconds, d.sleep_deep_seconds,
               d.sleep_rem_seconds, d.sleep_hr_avg, d.sleep_respiration_avg, d.sleep_spo2_avg, d.skin_temp_deviation_c,
               d.stress_avg, d.body_battery_high, d.steps, d.intensity_minutes, d.active_calories, d.floors_up,
               d.weight_kg, g.stress_rest_seconds, g.body_battery_at_wake, t.readiness, t.acute_load,
               t.vo2max_running, t.endurance_score, t.fitness_age, r.latest
        FROM days d LEFT JOIN garmin_daily g ON g.date = d.date LEFT JOIN garmin_training t ON t.date = d.date, r
        WHERE d.date > date(r.latest, '-' || :days || ' days') AND d.date <= r.latest
      ),
      p AS (
        SELECT CASE :grain WHEN 'month' THEN strftime('%Y-%m-01', date)
                           WHEN 'week' THEN date(date, 'weekday 0', '-6 days') ELSE date END AS period,
               CASE :metric
                 WHEN 'resting_hr' THEN resting_hr
                 WHEN 'hrv' THEN hrv_last_night_avg
                 WHEN 'sleep_score' THEN sleep_score
                 WHEN 'sleep_hours' THEN nullif(sleep_seconds, 0) / 3600.0
                 WHEN 'deep_hours' THEN sleep_deep_seconds / 3600.0
                 WHEN 'rem_hours' THEN sleep_rem_seconds / 3600.0
                 WHEN 'sleep_hr' THEN sleep_hr_avg
                 WHEN 'breathing' THEN sleep_respiration_avg
                 WHEN 'spo2' THEN sleep_spo2_avg
                 WHEN 'skin_temp' THEN skin_temp_deviation_c
                 WHEN 'stress' THEN stress_avg
                 WHEN 'rest_hours' THEN stress_rest_seconds / 3600.0
                 WHEN 'bb_wake' THEN body_battery_at_wake
                 WHEN 'bb_high' THEN body_battery_high
                 WHEN 'readiness' THEN readiness
                 WHEN 'steps' THEN CASE WHEN date < latest THEN nullif(steps, 0) END
                 WHEN 'intensity' THEN CASE WHEN date < latest THEN intensity_minutes END
                 WHEN 'active_kcal' THEN CASE WHEN date < latest THEN nullif(active_calories, 0) END
                 WHEN 'floors' THEN CASE WHEN date < latest THEN floors_up END
                 WHEN 'acute_load' THEN acute_load
                 WHEN 'vo2max' THEN vo2max_running
                 WHEN 'endurance' THEN endurance_score
                 WHEN 'weight' THEN weight_kg
                 WHEN 'fitness_age' THEN fitness_age
               END AS v,
               CASE :compare
                 WHEN 'resting_hr' THEN resting_hr
                 WHEN 'hrv' THEN hrv_last_night_avg
                 WHEN 'sleep_score' THEN sleep_score
                 WHEN 'sleep_hours' THEN nullif(sleep_seconds, 0) / 3600.0
                 WHEN 'deep_hours' THEN sleep_deep_seconds / 3600.0
                 WHEN 'rem_hours' THEN sleep_rem_seconds / 3600.0
                 WHEN 'sleep_hr' THEN sleep_hr_avg
                 WHEN 'breathing' THEN sleep_respiration_avg
                 WHEN 'spo2' THEN sleep_spo2_avg
                 WHEN 'skin_temp' THEN skin_temp_deviation_c
                 WHEN 'stress' THEN stress_avg
                 WHEN 'rest_hours' THEN stress_rest_seconds / 3600.0
                 WHEN 'bb_wake' THEN body_battery_at_wake
                 WHEN 'bb_high' THEN body_battery_high
                 WHEN 'readiness' THEN readiness
                 WHEN 'steps' THEN CASE WHEN date < latest THEN nullif(steps, 0) END
                 WHEN 'intensity' THEN CASE WHEN date < latest THEN intensity_minutes END
                 WHEN 'active_kcal' THEN CASE WHEN date < latest THEN nullif(active_calories, 0) END
                 WHEN 'floors' THEN CASE WHEN date < latest THEN floors_up END
                 WHEN 'acute_load' THEN acute_load
                 WHEN 'vo2max' THEN vo2max_running
                 WHEN 'endurance' THEN endurance_score
                 WHEN 'weight' THEN weight_kg
                 WHEN 'fitness_age' THEN fitness_age
               END AS c
        FROM base
      )
      SELECT period, round(avg(v), 2) AS "Reading",
             CASE WHEN :grain <> 'day' THEN round(min(v), 2) END AS lowest,
             CASE WHEN :grain <> 'day' THEN round(max(v), 2) END AS highest,
             count(v) AS days,
             round(avg(c), 2) AS "Next to it",
             CASE WHEN :grain <> 'day' THEN round(min(c), 2) END AS c_lowest,
             CASE WHEN :grain <> 'day' THEN round(max(c), 2) END AS c_highest
      FROM p GROUP BY period HAVING count(v) + count(c) > 0 ORDER BY period

  # The range as a whole: both measures' averages, and the latest period against the first one
  # (only when there are at least two periods).
  summary:
    sql: |
      WITH r AS (SELECT (SELECT max(date) FROM days WHERE has_data = 1) AS latest),
      base AS (
        SELECT d.date AS date, d.resting_hr, d.hrv_last_night_avg, d.sleep_score, d.sleep_seconds, d.sleep_deep_seconds,
               d.sleep_rem_seconds, d.sleep_hr_avg, d.sleep_respiration_avg, d.sleep_spo2_avg, d.skin_temp_deviation_c,
               d.stress_avg, d.body_battery_high, d.steps, d.intensity_minutes, d.active_calories, d.floors_up,
               d.weight_kg, g.stress_rest_seconds, g.body_battery_at_wake, t.readiness, t.acute_load,
               t.vo2max_running, t.endurance_score, t.fitness_age, r.latest
        FROM days d LEFT JOIN garmin_daily g ON g.date = d.date LEFT JOIN garmin_training t ON t.date = d.date, r
        WHERE d.date > date(r.latest, '-' || :days || ' days') AND d.date <= r.latest
      ),
      p AS (
        SELECT CASE :grain WHEN 'month' THEN strftime('%Y-%m-01', date)
                           WHEN 'week' THEN date(date, 'weekday 0', '-6 days') ELSE date END AS period,
               CASE :metric
                 WHEN 'resting_hr' THEN resting_hr
                 WHEN 'hrv' THEN hrv_last_night_avg
                 WHEN 'sleep_score' THEN sleep_score
                 WHEN 'sleep_hours' THEN nullif(sleep_seconds, 0) / 3600.0
                 WHEN 'deep_hours' THEN sleep_deep_seconds / 3600.0
                 WHEN 'rem_hours' THEN sleep_rem_seconds / 3600.0
                 WHEN 'sleep_hr' THEN sleep_hr_avg
                 WHEN 'breathing' THEN sleep_respiration_avg
                 WHEN 'spo2' THEN sleep_spo2_avg
                 WHEN 'skin_temp' THEN skin_temp_deviation_c
                 WHEN 'stress' THEN stress_avg
                 WHEN 'rest_hours' THEN stress_rest_seconds / 3600.0
                 WHEN 'bb_wake' THEN body_battery_at_wake
                 WHEN 'bb_high' THEN body_battery_high
                 WHEN 'readiness' THEN readiness
                 WHEN 'steps' THEN CASE WHEN date < latest THEN nullif(steps, 0) END
                 WHEN 'intensity' THEN CASE WHEN date < latest THEN intensity_minutes END
                 WHEN 'active_kcal' THEN CASE WHEN date < latest THEN nullif(active_calories, 0) END
                 WHEN 'floors' THEN CASE WHEN date < latest THEN floors_up END
                 WHEN 'acute_load' THEN acute_load
                 WHEN 'vo2max' THEN vo2max_running
                 WHEN 'endurance' THEN endurance_score
                 WHEN 'weight' THEN weight_kg
                 WHEN 'fitness_age' THEN fitness_age
               END AS v,
               CASE :compare
                 WHEN 'resting_hr' THEN resting_hr
                 WHEN 'hrv' THEN hrv_last_night_avg
                 WHEN 'sleep_score' THEN sleep_score
                 WHEN 'sleep_hours' THEN nullif(sleep_seconds, 0) / 3600.0
                 WHEN 'deep_hours' THEN sleep_deep_seconds / 3600.0
                 WHEN 'rem_hours' THEN sleep_rem_seconds / 3600.0
                 WHEN 'sleep_hr' THEN sleep_hr_avg
                 WHEN 'breathing' THEN sleep_respiration_avg
                 WHEN 'spo2' THEN sleep_spo2_avg
                 WHEN 'skin_temp' THEN skin_temp_deviation_c
                 WHEN 'stress' THEN stress_avg
                 WHEN 'rest_hours' THEN stress_rest_seconds / 3600.0
                 WHEN 'bb_wake' THEN body_battery_at_wake
                 WHEN 'bb_high' THEN body_battery_high
                 WHEN 'readiness' THEN readiness
                 WHEN 'steps' THEN CASE WHEN date < latest THEN nullif(steps, 0) END
                 WHEN 'intensity' THEN CASE WHEN date < latest THEN intensity_minutes END
                 WHEN 'active_kcal' THEN CASE WHEN date < latest THEN nullif(active_calories, 0) END
                 WHEN 'floors' THEN CASE WHEN date < latest THEN floors_up END
                 WHEN 'acute_load' THEN acute_load
                 WHEN 'vo2max' THEN vo2max_running
                 WHEN 'endurance' THEN endurance_score
                 WHEN 'weight' THEN weight_kg
                 WHEN 'fitness_age' THEN fitness_age
               END AS c
        FROM base
      ),
      per AS (SELECT period, avg(v) AS a FROM p WHERE v IS NOT NULL GROUP BY period)
      SELECT CASE :metric
               WHEN 'resting_hr' THEN 'Resting heart rate (bpm)'
               WHEN 'hrv' THEN 'Overnight HRV (ms)'
               WHEN 'sleep_score' THEN 'Sleep score'
               WHEN 'sleep_hours' THEN 'Time asleep (hours)'
               WHEN 'deep_hours' THEN 'Deep sleep (hours)'
               WHEN 'rem_hours' THEN 'REM sleep (hours)'
               WHEN 'sleep_hr' THEN 'Heart rate asleep (bpm)'
               WHEN 'breathing' THEN 'Breathing asleep (per minute)'
               WHEN 'spo2' THEN 'Blood oxygen asleep (%)'
               WHEN 'skin_temp' THEN 'Skin temperature change (°C)'
               WHEN 'stress' THEN 'Average stress'
               WHEN 'rest_hours' THEN 'Time at rest (hours)'
               WHEN 'bb_wake' THEN 'Body Battery at wake'
               WHEN 'bb_high' THEN 'Body Battery, highest'
               WHEN 'readiness' THEN 'Training readiness'
               WHEN 'steps' THEN 'Steps'
               WHEN 'intensity' THEN 'Intensity minutes'
               WHEN 'active_kcal' THEN 'Active calories'
               WHEN 'floors' THEN 'Floors climbed'
               WHEN 'acute_load' THEN 'Acute training load'
               WHEN 'vo2max' THEN 'VO2 max (running)'
               WHEN 'endurance' THEN 'Endurance score'
               WHEN 'weight' THEN 'Weight (kg)'
               WHEN 'fitness_age' THEN 'Fitness age (years)'
             END || printf(' · %d day%s', (SELECT count(v) FROM p), CASE WHEN (SELECT count(v) FROM p) = 1 THEN '' ELSE 's' END)
               AS measure,
             CASE :compare
               WHEN 'resting_hr' THEN 'Resting heart rate (bpm)'
               WHEN 'hrv' THEN 'Overnight HRV (ms)'
               WHEN 'sleep_score' THEN 'Sleep score'
               WHEN 'sleep_hours' THEN 'Time asleep (hours)'
               WHEN 'deep_hours' THEN 'Deep sleep (hours)'
               WHEN 'rem_hours' THEN 'REM sleep (hours)'
               WHEN 'sleep_hr' THEN 'Heart rate asleep (bpm)'
               WHEN 'breathing' THEN 'Breathing asleep (per minute)'
               WHEN 'spo2' THEN 'Blood oxygen asleep (%)'
               WHEN 'skin_temp' THEN 'Skin temperature change (°C)'
               WHEN 'stress' THEN 'Average stress'
               WHEN 'rest_hours' THEN 'Time at rest (hours)'
               WHEN 'bb_wake' THEN 'Body Battery at wake'
               WHEN 'bb_high' THEN 'Body Battery, highest'
               WHEN 'readiness' THEN 'Training readiness'
               WHEN 'steps' THEN 'Steps'
               WHEN 'intensity' THEN 'Intensity minutes'
               WHEN 'active_kcal' THEN 'Active calories'
               WHEN 'floors' THEN 'Floors climbed'
               WHEN 'acute_load' THEN 'Acute training load'
               WHEN 'vo2max' THEN 'VO2 max (running)'
               WHEN 'endurance' THEN 'Endurance score'
               WHEN 'weight' THEN 'Weight (kg)'
               WHEN 'fitness_age' THEN 'Fitness age (years)'
             END AS compare,
             round((SELECT avg(v) FROM p), 1) AS average, round((SELECT avg(c) FROM p), 1) AS compare_average,
             round((SELECT a FROM per ORDER BY period DESC LIMIT 1), 1) AS latest,
             CASE WHEN (SELECT count(*) FROM per) >= 2
                  THEN (SELECT a FROM per ORDER BY period DESC LIMIT 1) - (SELECT a FROM per ORDER BY period LIMIT 1) END
               AS change,
             (SELECT min(v) FROM p) AS lowest, (SELECT max(v) FROM p) AS highest,
             (SELECT count(v) FROM p) AS days,
             CASE :grain WHEN 'month' THEN 'This month' WHEN 'week' THEN 'This week' ELSE 'The latest day' END AS latest_word

layout:
  - - type: controls

  - - type: stat
      title: Average over the range
      class: trend
      query: summary
      value: average
      format: number
      note: measure
    - type: stat
      title: Latest
      class: trend
      query: summary
      value: latest
      format: number
      delta: change
      note: latest_word
    - type: stat
      title: Lowest day
      class: trend
      query: summary
      value: lowest
      format: number
    - type: stat
      title: Highest day
      class: trend
      query: summary
      value: highest
      format: number
    - type: stat
      title: Next to it, average
      class: trend-compare
      query: summary
      value: compare_average
      format: number
      note: compare

  - - type: line
      title: The measure, over time
      id: trend-main
      class: trend
      query: periods
      x: period
      y: Reading
      band: {low: lowest, high: highest, label: Lowest to highest day}
      format: number
      hide_empty: true
    - type: line
      title: The measure next to it
      id: trend-compare
      class: trend-compare
      query: periods
      x: period
      y: Next to it
      band: {low: c_lowest, high: c_highest, label: Lowest to highest day}
      format: number
      hide_empty: true

  - - type: text
      class: notes
      body: |
        Pick a **measure**, a second one to set **next to** it, how far back to look (counted
        from the latest day with data), and whether to see each day or the average of each week or
        month. In week and month averages the line is the
        average and the shaded band runs from the lowest to the highest day. A week starts on
        Monday; a month is labelled with its first day; the first and last may be only partly
        covered. With only a few days recorded, each day says more than averages do.

        Readiness, sleep score, stress, Body Battery, HRV, loads, VO2 max and the scores are
        **Garmin's own calculations**. Sleep is stored on the morning you woke up.
