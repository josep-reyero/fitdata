spec: easy-ui/v1
title: Heart and HRV
description: >-
  Your heart through the day, your resting heart rate against its usual, and overnight HRV
  against the baseline Garmin keeps for you.

params:
  day:
    type: date
    label: Day
    default: today
  days:
    type: choice
    label: Period
    default: 14
    options:
      - {value: 14, label: 2 weeks}
      - {value: 30, label: 30 days}
      - {value: 90, label: 90 days}
      - {value: 180, label: 6 months}
      - {value: 365, label: 1 year}

queries:
  # The chosen day (or the most recent one with data), against your usual: the average of the days
  # before it (up to 28), once there are 3.
  today:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      usual AS (
        SELECT avg(x.resting_hr) AS rhr, count(x.resting_hr) AS n_rhr,
               avg(x.hrv_last_night_avg) AS hrv, count(x.hrv_last_night_avg) AS n_hrv
        FROM days x, sel
        WHERE x.has_data = 1 AND x.date >= date(sel.d, '-28 days') AND x.date < sel.d
      )
      SELECT d.resting_hr AS rhr, CASE WHEN u.n_rhr >= 3 THEN d.resting_hr - u.rhr END AS rhr_change,
             d.min_hr AS low, d.max_hr AS high,
             d.hrv_last_night_avg AS hrv, CASE WHEN u.n_hrv >= 3 THEN d.hrv_last_night_avg - u.hrv END AS hrv_change,
             CASE WHEN d.hrv_last_night_avg IS NULL THEN NULL
                  WHEN d.hrv_status IS NULL OR upper(d.hrv_status) = 'NONE' THEN 'No baseline yet'
                  ELSE upper(substr(d.hrv_status, 1, 1)) || lower(substr(replace(d.hrv_status, '_', ' '), 2)) END AS hrv_word,
             g.hrv_weekly_avg AS hrv_week,
             CASE WHEN g.hrv_baseline_low IS NOT NULL
                  THEN printf('Baseline %g–%g', g.hrv_baseline_low, g.hrv_baseline_high) END AS baseline_word
      FROM sel LEFT JOIN days d ON d.date = sel.d AND d.has_data = 1
           LEFT JOIN garmin_daily g ON g.date = sel.d, usual u

  through_the_day:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT substr(s.at, 12, 5) AS time, s.value AS "Heart rate"
      FROM garmin_samples s, sel
      WHERE s.date = sel.d AND s.series = 'heart_rate'
      ORDER BY s.at

  overnight:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT substr(s.at, 12, 5) AS time, s.value AS "HRV"
      FROM garmin_samples s, sel
      WHERE s.date = sel.d AND s.series = 'sleep_hrv'
      ORDER BY s.at

  # One row per day: the reading, its 7-day average (once 3 of the 7 days have one) and 28-day
  # average (once 14 of the 28 do), and Garmin's HRV baseline.
  daily:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      x AS (
        SELECT d.date, d.resting_hr, d.min_hr, d.max_hr, d.hrv_last_night_avg AS hrv,
               avg(d.resting_hr) OVER w7 AS rhr_7d, count(d.resting_hr) OVER w7 AS n_7d,
               avg(d.resting_hr) OVER w28 AS rhr_28d, count(d.resting_hr) OVER w28 AS n_28d,
               g.hrv_weekly_avg, g.hrv_baseline_low, g.hrv_baseline_high
        FROM days d LEFT JOIN garmin_daily g ON g.date = d.date
        WHERE d.has_data = 1
        WINDOW w7 AS (ORDER BY julianday(d.date) RANGE BETWEEN 6 PRECEDING AND CURRENT ROW),
               w28 AS (ORDER BY julianday(d.date) RANGE BETWEEN 27 PRECEDING AND CURRENT ROW)
      )
      SELECT x.date AS day,
             x.resting_hr AS "Resting heart rate",
             CASE WHEN x.n_7d >= 3 THEN round(x.rhr_7d, 1) END AS "7-day average",
             CASE WHEN x.n_28d >= 14 THEN round(x.rhr_28d, 1) END AS "28-day average",
             x.hrv AS "Overnight HRV", x.hrv_weekly_avg AS "7-day HRV average",
             x.hrv_baseline_low AS baseline_low, x.hrv_baseline_high AS baseline_high,
             x.min_hr AS "Lowest", x.max_hr AS "Highest"
      FROM x, sel
      WHERE x.date > date(sel.d, '-' || :days || ' days') AND x.date <= sel.d
      ORDER BY x.date

  nights:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT d.date AS day, d.hrv_last_night_avg AS hrv, g.hrv_weekly_avg AS week,
             CASE WHEN g.hrv_baseline_low IS NOT NULL
                  THEN printf('%g–%g', g.hrv_baseline_low, g.hrv_baseline_high) END AS baseline,
             upper(substr(d.hrv_status, 1, 1)) || lower(substr(d.hrv_status, 2)) AS status,
             d.resting_hr AS rhr
      FROM days d LEFT JOIN garmin_daily g ON g.date = d.date, sel
      WHERE d.has_data = 1 AND d.date > date(sel.d, '-14 days') AND d.date <= sel.d
      ORDER BY d.date DESC

layout:
  - - type: controls

  - - type: stat
      title: Resting heart rate
      class: heart
      query: today
      value: rhr
      format: integer
      delta: rhr_change
      delta_format: decimal1
      better: lower
      hint: Beats per minute
    - type: stat
      title: Lowest
      class: heart
      query: today
      value: low
      format: integer
      hint: Usually asleep
    - type: stat
      title: Highest
      class: heart
      query: today
      value: high
      format: integer
    - type: stat
      title: Overnight HRV
      class: heart
      query: today
      value: hrv
      format: integer
      delta: hrv_change
      delta_format: integer
      better: higher
      note: hrv_word
      hint: Milliseconds
    - type: stat
      title: HRV, 7-day average
      class: heart
      query: today
      value: hrv_week
      format: integer
      note: baseline_word
      hide_empty: true

  - - type: line
      title: Heart rate through the day
      id: day-heart
      class: heart
      query: through_the_day
      x: time
      y: Heart rate
      format: integer
      unit: bpm
      hide_empty: true
    - type: line
      title: HRV through the night
      id: night-hrv
      class: heart
      query: overnight
      x: time
      y: HRV
      format: integer
      unit: ms
      hide_empty: true

  - - type: line
      title: Resting heart rate
      id: rhr-days
      class: [heart, with-average]
      query: daily
      x: day
      y: [Resting heart rate, 7-day average, 28-day average]
      dashed: [7-day average, 28-day average]
      format: integer
      unit: bpm
      hide_empty: true
    - type: line
      title: Overnight HRV and your baseline
      id: hrv-baseline
      class: [heart, with-average]
      query: daily
      x: day
      y: [Overnight HRV, 7-day HRV average]
      dashed: 7-day HRV average
      band: {low: baseline_low, high: baseline_high, label: Your baseline}
      format: integer
      unit: ms
      hide_empty: true

  - - type: line
      title: Lowest and highest heart rate
      id: hr-range
      class: heart
      query: daily
      x: day
      y: [Highest, Lowest]
      format: integer
      unit: bpm
      hide_empty: true
    - type: table
      title: The last two weeks
      class: heart
      query: nights
      hide_empty: true
      columns:
        - {column: day, label: Morning of, format: date}
        - {column: hrv, label: HRV (ms), format: integer}
        - {column: week, label: 7-day avg, format: integer}
        - {column: baseline, label: Baseline}
        - {column: status, label: Status}
        - {column: rhr, label: Resting HR, format: integer}

  - - type: text
      class: notes
      body: |
        **Resting heart rate** a few beats above its usual often comes with stress, illness,
        alcohol or hard training; a slow drift down over months with fitness. The arrows compare
        the day with your average of the days before it (up to 28), once there are 3; the dashed
        lines are the 7-day and 28-day averages, drawn once there are enough days for them.

        **HRV** (heart rate variability) is measured during sleep. What matters is your 7-day
        average against your own baseline, the shaded band: inside it is balanced, below it is a
        sign to take it easier. HRV status and baseline are **Garmin's own calculations**; Garmin
        needs about three weeks of nights before it shows a baseline.
