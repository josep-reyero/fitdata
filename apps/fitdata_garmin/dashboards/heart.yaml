spec: easy-ui/v1
title: Heart and HRV
description: >-
  Your heart through the day, your resting heart rate against its usual, and overnight HRV
  against the baseline Garmin keeps for you.

params:
  day:
    type: date
    label: Day
    default: today
  days:
    type: choice
    label: Period
    default: 90
    options:
      - {value: 30, label: 30 days}
      - {value: 90, label: 90 days}
      - {value: 180, label: 6 months}
      - {value: 365, label: 1 year}

queries:
  # The chosen day (or the most recent one with data), against the 28 days before it.
  today:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      usual AS (
        SELECT avg(x.resting_hr) AS rhr FROM days x, sel
        WHERE x.has_data = 1 AND x.date >= date(sel.d, '-28 days') AND x.date < sel.d
      )
      SELECT d.resting_hr AS rhr, d.resting_hr - u.rhr AS rhr_change, g.resting_hr_7d AS rhr_7d,
             d.min_hr AS low, d.max_hr AS high,
             d.hrv_last_night_avg AS hrv, d.hrv_last_night_avg - g.hrv_weekly_avg AS hrv_vs_week,
             g.hrv_weekly_avg AS hrv_week,
             upper(substr(d.hrv_status, 1, 1)) || lower(substr(d.hrv_status, 2)) AS hrv_status,
             CASE WHEN g.hrv_baseline_low IS NOT NULL
                  THEN printf('%g–%g ms', g.hrv_baseline_low, g.hrv_baseline_high) END AS baseline
      FROM sel LEFT JOIN days d ON d.date = sel.d AND d.has_data = 1
           LEFT JOIN garmin_daily g ON g.date = sel.d, usual u

  through_the_day:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT substr(s.at, 12, 5) AS time, s.value AS "Heart rate"
      FROM garmin_samples s, sel
      WHERE s.date = sel.d AND s.series = 'heart_rate'
      ORDER BY s.at

  overnight:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT substr(s.at, 12, 5) AS time,
             max(CASE WHEN s.series = 'sleep_hrv' THEN s.value END) AS "HRV"
      FROM garmin_samples s, sel
      WHERE s.date = sel.d AND s.series = 'sleep_hrv'
      GROUP BY s.at
      ORDER BY s.at

  # One row per day: the reading, its 7-day and 28-day averages, and Garmin's HRV baseline.
  daily:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      x AS (
        SELECT d.date, d.resting_hr, d.min_hr, d.max_hr, d.hrv_last_night_avg AS hrv,
               avg(d.resting_hr) OVER w7 AS rhr_7d, avg(d.resting_hr) OVER w28 AS rhr_28d,
               g.hrv_weekly_avg, g.hrv_baseline_low, g.hrv_baseline_high
        FROM days d LEFT JOIN garmin_daily g ON g.date = d.date
        WHERE d.has_data = 1
        WINDOW w7 AS (ORDER BY julianday(d.date) RANGE BETWEEN 6 PRECEDING AND CURRENT ROW),
               w28 AS (ORDER BY julianday(d.date) RANGE BETWEEN 27 PRECEDING AND CURRENT ROW)
      )
      SELECT x.date AS day,
             x.resting_hr AS "Resting heart rate", round(x.rhr_7d, 1) AS "7-day average",
             round(x.rhr_28d, 1) AS "28-day average",
             x.hrv AS "Overnight HRV", x.hrv_weekly_avg AS "Weekly average",
             x.hrv_baseline_low AS "Baseline, low end", x.hrv_baseline_high AS "Baseline, high end",
             x.min_hr AS "Lowest", x.max_hr AS "Highest"
      FROM x, sel
      WHERE x.date > date(sel.d, '-' || :days || ' days') AND x.date <= sel.d
      ORDER BY x.date

  nights:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT d.date AS day, d.hrv_last_night_avg AS hrv, g.hrv_5min_high AS high, g.hrv_weekly_avg AS week,
             CASE WHEN g.hrv_baseline_low IS NOT NULL
                  THEN printf('%g–%g', g.hrv_baseline_low, g.hrv_baseline_high) END AS baseline,
             upper(substr(d.hrv_status, 1, 1)) || lower(substr(d.hrv_status, 2)) AS status,
             d.resting_hr AS rhr, g.resting_hr_7d AS rhr_7d
      FROM days d LEFT JOIN garmin_daily g ON g.date = d.date, sel
      WHERE d.has_data = 1 AND d.date > date(sel.d, '-14 days') AND d.date <= sel.d
      ORDER BY d.date DESC

layout:
  - - type: controls

  - - type: stat
      title: Resting heart rate
      class: heart
      query: today
      value: rhr
      format: integer
      delta: rhr_change
      delta_format: decimal1
      better: lower
      hint: Beats per minute, against your average for the 28 days before.
    - type: stat
      title: Lowest
      class: heart
      query: today
      value: low
      format: integer
      hint: The day's lowest heart rate, usually asleep.
    - type: stat
      title: Highest
      class: heart
      query: today
      value: high
      format: integer
      hint: The day's highest heart rate.
    - type: stat
      title: Overnight HRV
      class: heart
      query: today
      value: hrv
      format: integer
      delta: hrv_vs_week
      delta_format: decimal1
      better: higher
      hint: Milliseconds, against your 7-day HRV average.
    - type: stat
      title: HRV status
      class: heart
      query: today
      value: hrv_status
      hint: Garmin's verdict, from the 7-day average against your baseline.
    - type: stat
      title: Your HRV baseline
      class: heart
      query: today
      value: baseline
      hint: The balanced range Garmin has learnt for you over weeks.

  - - type: line
      title: Heart rate through the day
      id: day-heart
      class: heart
      query: through_the_day
      x: time
      y: Heart rate
      format: integer
      unit: bpm

  - - type: line
      title: Resting heart rate
      class: [heart, with-baselines]
      query: daily
      x: day
      y: [Resting heart rate, 7-day average, 28-day average]
      format: integer
      unit: bpm
    - type: line
      title: Overnight HRV and your baseline
      id: hrv-baseline
      class: [heart, hrv-band]
      query: daily
      x: day
      y: [Overnight HRV, Weekly average, "Baseline, low end", "Baseline, high end"]
      format: integer
      unit: ms

  - - type: line
      title: HRV through the night
      class: heart
      query: overnight
      x: time
      y: HRV
      format: integer
      unit: ms
    - type: line
      title: Lowest and highest heart rate
      class: [heart, with-baselines]
      query: daily
      x: day
      y: [Highest, Lowest]
      format: integer
      unit: bpm

  - - type: table
      title: The last two weeks
      class: heart
      query: nights
      columns:
        - {column: day, label: Morning of, format: date}
        - {column: hrv, label: HRV (ms), format: integer}
        - {column: high, label: 5-min high, format: integer}
        - {column: week, label: 7-day avg, format: integer}
        - {column: baseline, label: Baseline}
        - {column: status, label: Status}
        - {column: rhr, label: Resting HR, format: integer}
        - {column: rhr_7d, label: "Resting, 7-day", format: integer}

  - - type: text
      class: notes
      body: |
        **Resting heart rate** a few beats above your 28-day line often comes with stress,
        illness, alcohol or hard training; a slow drift down over months with fitness.
        **HRV** (heart rate variability) is measured during sleep. What matters is your 7-day
        average against your own baseline, the two pale lines of the chart: between them is
        balanced, below them is a sign to take it easier.

        HRV status and baseline are **Garmin's own calculations**; Garmin needs about three weeks
        of nights before it shows a baseline. The charts through the day and night are kept for
        the most recent weeks only.
