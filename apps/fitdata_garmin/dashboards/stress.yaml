spec: easy-ui/v1
title: Stress and energy
description: >-
  How stressful the day was and how your Body Battery charged and drained, through the day and
  day by day.

params:
  day:
    type: date
    label: Day
    default: today
  days:
    type: choice
    label: Period
    default: 30
    options:
      - {value: 14, label: 2 weeks}
      - {value: 30, label: 30 days}
      - {value: 90, label: 90 days}
      - {value: 365, label: 1 year}

queries:
  # The chosen day (or the most recent one with data), against the 28 days before it.
  today:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      usual AS (
        SELECT avg(x.stress_avg) AS stress, avg(g.stress_rest_seconds) AS rest,
               avg(g.body_battery_at_wake) AS bbw, avg(g.body_battery_charged) AS charged,
               avg(g.body_battery_drained) AS drained
        FROM days x LEFT JOIN garmin_daily g ON g.date = x.date, sel
        WHERE x.has_data = 1 AND x.date >= date(sel.d, '-28 days') AND x.date < sel.d
      )
      SELECT d.stress_avg AS stress, d.stress_avg - u.stress AS stress_change,
             g.stress_max AS stress_max,
             g.stress_rest_seconds AS rest, g.stress_rest_seconds - u.rest AS rest_change,
             g.body_battery_at_wake AS bbw, g.body_battery_at_wake - u.bbw AS bbw_change,
             g.body_battery_charged AS charged, g.body_battery_charged - u.charged AS charged_change,
             g.body_battery_drained AS drained, g.body_battery_drained - u.drained AS drained_change
      FROM sel LEFT JOIN days d ON d.date = sel.d AND d.has_data = 1
           LEFT JOIN garmin_daily g ON g.date = sel.d, usual u

  through_the_day:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT substr(s.at, 12, 5) AS time,
             max(CASE WHEN s.series = 'body_battery' THEN s.value END) AS "Body Battery",
             max(CASE WHEN s.series = 'stress' THEN s.value END) AS "Stress"
      FROM garmin_samples s, sel
      WHERE s.date = sel.d AND s.series IN ('body_battery', 'stress')
      GROUP BY s.at
      ORDER BY s.at

  # Time in each of Garmin's stress levels on the chosen day, in hours.
  levels:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      g AS (SELECT * FROM garmin_daily, sel WHERE date = sel.d)
      SELECT 'Rest (0–25)' AS level, round(stress_rest_seconds / 3600.0, 2) AS "Hours" FROM g
      UNION ALL SELECT 'Low (26–50)', round(stress_low_seconds / 3600.0, 2) FROM g
      UNION ALL SELECT 'Medium (51–75)', round(stress_medium_seconds / 3600.0, 2) FROM g
      UNION ALL SELECT 'High (76–100)', round(stress_high_seconds / 3600.0, 2) FROM g
      UNION ALL SELECT 'Moving', round(stress_activity_seconds / 3600.0, 2) FROM g

  # What charged and drained the Body Battery that day (and the night before it).
  events:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT e.start AS started,
             upper(substr(e.type, 1, 1)) || substr(e.type, 2) AS kind,
             e.duration_seconds AS duration, e.impact,
             upper(substr(replace(e.feedback, '_', ' '), 1, 1)) || lower(substr(replace(e.feedback, '_', ' '), 2)) AS feedback
      FROM garmin_body_battery_events e, sel
      WHERE e.date = sel.d
      ORDER BY e.start

  # One row per day of the period, ending on the chosen day.
  daily:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      x AS (
        SELECT d.date, d.stress_avg, avg(d.stress_avg) OVER w AS stress_7d,
               d.body_battery_high, d.body_battery_low, g.stress_rest_seconds, g.stress_low_seconds,
               g.stress_medium_seconds, g.stress_high_seconds, g.body_battery_charged, g.body_battery_drained,
               g.body_battery_at_wake
        FROM days d LEFT JOIN garmin_daily g ON g.date = d.date
        WINDOW w AS (ORDER BY julianday(d.date) RANGE BETWEEN 6 PRECEDING AND CURRENT ROW)
      )
      SELECT x.date AS day,
             round(x.stress_rest_seconds / 3600.0, 2) AS "Rest",
             round(x.stress_low_seconds / 3600.0, 2) AS "Low",
             round(x.stress_medium_seconds / 3600.0, 2) AS "Medium",
             round(x.stress_high_seconds / 3600.0, 2) AS "High",
             x.stress_avg AS "Average stress", round(x.stress_7d, 1) AS "7-day average",
             x.body_battery_charged AS "Charged", x.body_battery_drained AS "Drained",
             x.body_battery_high AS "Highest", x.body_battery_at_wake AS "At wake", x.body_battery_low AS "Lowest"
      FROM x, sel
      WHERE x.date > date(sel.d, '-' || :days || ' days') AND x.date <= sel.d
      ORDER BY x.date

layout:
  - - type: controls

  - - type: stat
      title: Average stress
      class: stress
      query: today
      value: stress
      format: integer
      delta: stress_change
      delta_format: decimal1
      better: lower
      hint: 0 to 100 over the day, against your average for the 28 days before.
    - type: stat
      title: Highest stress
      class: stress
      query: today
      value: stress_max
      format: integer
      hint: The day's peak.
    - type: stat
      title: Time at rest
      class: stress
      query: today
      value: rest
      format: duration
      delta: rest_change
      better: higher
      hint: Stress 0 to 25, awake or asleep. This is when the Body Battery charges.
    - type: stat
      title: Body Battery at wake
      class: energy
      query: today
      value: bbw
      format: integer
      delta: bbw_change
      delta_format: decimal1
      better: higher
      hint: Out of 100.
    - type: stat
      title: Charged
      class: energy
      query: today
      value: charged
      format: integer
      delta: charged_change
      delta_format: decimal1
      better: higher
      hint: Points gained over the day, mostly asleep.
    - type: stat
      title: Drained
      class: energy
      query: today
      value: drained
      format: integer
      delta: drained_change
      delta_format: decimal1
      better: lower
      hint: Points spent on activity, stress and being awake.

  - - type: line
      title: Body Battery and stress through the day
      id: day-energy
      class: [energy, pair-energy-stress]
      query: through_the_day
      x: time
      y: [Body Battery, Stress]
      format: integer
      step: 25

  - - type: bar
      title: Time in each stress level
      id: levels
      class: stress
      query: levels
      x: level
      y: Hours
      format: decimal1
      unit: h
    - type: table
      title: What charged and drained it
      class: energy
      query: events
      columns:
        - {column: started, label: Started, format: datetime}
        - {column: kind, label: What}
        - {column: duration, label: For, format: duration}
        - {column: impact, label: Body Battery, format: integer}
        - {column: feedback, label: Garmin says}

  - - type: bar
      title: Stress levels, day by day
      id: stress-bands
      class: [stress, bands]
      query: daily
      x: day
      y: [Rest, Low, Medium, High]
      format: decimal1
      unit: h
      stacked: true
    - type: line
      title: Average stress
      class: [stress, with-average]
      query: daily
      x: day
      y: [Average stress, 7-day average]
      format: integer

  - - type: bar
      title: Body Battery charged and drained
      id: charged-drained
      class: [energy, pair-charge]
      query: daily
      x: day
      y: [Charged, Drained]
      format: integer
    - type: line
      title: Body Battery, highest, at wake and lowest
      id: bb-range
      class: [energy, range-three]
      query: daily
      x: day
      y: [Highest, At wake, Lowest]
      format: integer
      step: 25

  - - type: text
      class: notes
      body: |
        **Stress** is Garmin's reading of your nervous system from heart rate variability, 0 to
        100: rest 0–25, low 26–50, medium 51–75, high 76–100. It is not measured while you move,
        so activities show as gaps. **Body Battery** charges when stress is at rest, above all
        asleep, and drains with activity and stress.

        Both are **Garmin's own calculations**. A dash means the watch had no reading. The chart
        through the day is kept for the most recent weeks only.
