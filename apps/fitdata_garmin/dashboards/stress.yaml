spec: easy-ui/v1
title: Stress and energy
description: >-
  How stressful the day was and how your Body Battery charged and drained, through the day and
  day by day.

params:
  day:
    type: date
    label: Day
    default: today
  days:
    type: choice
    label: Period
    default: 14
    options:
      - {value: 14, label: 2 weeks}
      - {value: 30, label: 30 days}
      - {value: 90, label: 90 days}
      - {value: 365, label: 1 year}

queries:
  # The chosen day (or the most recent one with data), against your usual: the average of the days
  # before it (up to 28), once there are 3.
  today:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      usual AS (
        SELECT avg(x.stress_avg) AS stress, count(x.stress_avg) AS n_stress,
               avg(g.stress_rest_seconds) AS rest, count(g.stress_rest_seconds) AS n_rest,
               avg(g.body_battery_at_wake) AS bbw, count(g.body_battery_at_wake) AS n_bbw,
               avg(g.body_battery_charged) AS charged, count(g.body_battery_charged) AS n_charged,
               avg(g.body_battery_drained) AS drained, count(g.body_battery_drained) AS n_drained
        FROM days x LEFT JOIN garmin_daily g ON g.date = x.date, sel
        WHERE x.has_data = 1 AND x.date >= date(sel.d, '-28 days') AND x.date < sel.d
      )
      SELECT d.stress_avg AS stress, CASE WHEN u.n_stress >= 3 THEN d.stress_avg - u.stress END AS stress_change,
             CASE WHEN d.stress_avg IS NULL THEN NULL WHEN d.stress_avg <= 25 THEN 'Rest'
                  WHEN d.stress_avg <= 50 THEN 'Low' WHEN d.stress_avg <= 75 THEN 'Medium' ELSE 'High' END AS stress_word,
             g.stress_max AS stress_max,
             g.stress_rest_seconds AS rest,
             CASE WHEN u.n_rest >= 3 THEN round((g.stress_rest_seconds - u.rest) / 60) * 60 END AS rest_change,
             g.body_battery_at_wake AS bbw, CASE WHEN u.n_bbw >= 3 THEN g.body_battery_at_wake - u.bbw END AS bbw_change,
             g.body_battery_charged AS charged,
             CASE WHEN u.n_charged >= 3 THEN g.body_battery_charged - u.charged END AS charged_change,
             g.body_battery_drained AS drained,
             CASE WHEN u.n_drained >= 3 THEN g.body_battery_drained - u.drained END AS drained_change,
             upper(substr(replace(replace(g.body_battery_feedback, 'DAY_', ''), '_', ' '), 1, 1))
               || lower(substr(replace(replace(g.body_battery_feedback, 'DAY_', ''), '_', ' '), 2)) AS bb_word
      FROM sel LEFT JOIN days d ON d.date = sel.d AND d.has_data = 1
           LEFT JOIN garmin_daily g ON g.date = sel.d, usual u

  through_the_day:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT substr(s.at, 12, 5) AS time,
             max(CASE WHEN s.series = 'body_battery' THEN s.value END) AS "Body Battery",
             max(CASE WHEN s.series = 'stress' THEN s.value END) AS "Stress"
      FROM garmin_samples s, sel
      WHERE s.date = sel.d AND s.series IN ('body_battery', 'stress')
      GROUP BY s.at
      ORDER BY s.at

  # Time in each of Garmin's stress levels on the chosen day, in seconds.
  levels:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      g AS (SELECT * FROM garmin_daily, sel WHERE date = sel.d AND stress_rest_seconds IS NOT NULL)
      SELECT 'Rest' AS level, stress_rest_seconds AS "Time" FROM g
      UNION ALL SELECT 'Low', stress_low_seconds FROM g
      UNION ALL SELECT 'Medium', stress_medium_seconds FROM g
      UNION ALL SELECT 'High', stress_high_seconds FROM g
      UNION ALL SELECT 'Moving', stress_activity_seconds FROM g

  # What charged and drained the Body Battery that day (and the night before it).
  events:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT e.start AS started,
             upper(substr(e.type, 1, 1)) || substr(e.type, 2) AS kind,
             e.duration_seconds AS duration, e.impact,
             upper(substr(replace(e.feedback, '_', ' '), 1, 1)) || lower(substr(replace(e.feedback, '_', ' '), 2)) AS feedback
      FROM garmin_body_battery_events e, sel
      WHERE e.date = sel.d
      ORDER BY e.start

  # One row per day of the period, ending on the chosen day. The 7-day average appears once 3 of
  # the 7 days have a reading.
  daily:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      x AS (
        SELECT d.date, d.stress_avg, avg(d.stress_avg) OVER w AS stress_7d, count(d.stress_avg) OVER w AS n_7d,
               d.body_battery_high, d.body_battery_low, g.stress_rest_seconds, g.stress_low_seconds,
               g.stress_medium_seconds, g.stress_high_seconds, g.body_battery_charged, g.body_battery_drained,
               g.body_battery_at_wake
        FROM days d LEFT JOIN garmin_daily g ON g.date = d.date
        WINDOW w AS (ORDER BY julianday(d.date) RANGE BETWEEN 6 PRECEDING AND CURRENT ROW)
      )
      SELECT x.date AS day,
             x.stress_rest_seconds AS "Rest", x.stress_low_seconds AS "Low",
             x.stress_medium_seconds AS "Medium", x.stress_high_seconds AS "High",
             x.stress_avg AS "Average stress", CASE WHEN x.n_7d >= 3 THEN round(x.stress_7d, 1) END AS "7-day average",
             x.body_battery_charged AS "Charged", x.body_battery_drained AS "Drained",
             x.body_battery_high AS "Highest", x.body_battery_at_wake AS "At wake", x.body_battery_low AS "Lowest"
      FROM x, sel
      WHERE x.date > date(sel.d, '-' || :days || ' days') AND x.date <= sel.d
      ORDER BY x.date

layout:
  - - type: controls

  - - type: stat
      title: Average stress
      class: stress
      query: today
      value: stress
      format: integer
      delta: stress_change
      delta_format: integer
      better: lower
      note: stress_word
      hint: 0 to 100
    - type: stat
      title: Highest stress
      class: stress
      query: today
      value: stress_max
      format: integer
    - type: stat
      title: Time at rest
      class: [stress, duration]
      query: today
      value: rest
      format: duration
      delta: rest_change
      better: higher
    - type: stat
      title: Body Battery at wake
      class: energy
      query: today
      value: bbw
      format: integer
      delta: bbw_change
      delta_format: integer
      better: higher
    - type: stat
      title: Charged
      class: energy
      query: today
      value: charged
      format: integer
      delta: charged_change
      delta_format: integer
      better: higher
      hint: Points
    - type: stat
      title: Drained
      class: energy
      query: today
      value: drained
      format: integer
      delta: drained_change
      delta_format: integer
      better: lower
      note: bb_word

  - - type: line
      title: Body Battery and stress through the day
      id: day-energy
      class: [energy, pair-energy-stress]
      query: through_the_day
      x: time
      y: [Body Battery, Stress]
      format: integer
      step: 25
      hide_empty: true
    - type: bar
      title: Time in each stress level
      id: levels
      class: [stress, bands]
      query: levels
      x: level
      y: Time
      format: duration
      colors_by: level
      hide_empty: true

  - - type: bar
      title: Stress levels, day by day
      id: stress-bands
      class: [stress, bands]
      query: daily
      x: day
      y: [Rest, Low, Medium, High]
      format: duration
      stacked: true
      hide_empty: true
    - type: line
      title: Average stress
      id: stress-days
      class: [stress, with-average]
      query: daily
      x: day
      y: [Average stress, 7-day average]
      dashed: 7-day average
      format: integer
      hide_empty: true

  - - type: bar
      title: Body Battery charged and drained
      id: charged-drained
      class: [energy, pair-charge]
      query: daily
      x: day
      y: [Charged, Drained]
      format: integer
      hide_empty: true
    - type: line
      title: Body Battery at wake, and the day's range
      id: bb-range
      class: energy
      query: daily
      x: day
      y: At wake
      band: {low: Lowest, high: Highest, label: Lowest to highest}
      format: integer
      step: 25
      hide_empty: true

  - - type: table
      title: What charged and drained it
      class: energy
      query: events
      hide_empty: true
      columns:
        - {column: started, label: From, format: clock}
        - {column: kind, label: What}
        - {column: duration, label: For, format: duration}
        - {column: impact, label: Body Battery, format: integer}
        - {column: feedback, label: Garmin says}
    - type: text
      class: notes
      body: |
        **Stress** is Garmin's reading of your nervous system from heart rate variability, 0 to
        100: rest 0–25, low 26–50, medium 51–75, high 76–100. It is not measured while you move,
        so activities show as gaps. **Body Battery** charges when stress is at rest, above all
        asleep, and drains with activity and stress.

        The arrows compare the day with **your usual**, the average of the days before it (up to
        28); they appear once there are 3. Both measures are **Garmin's own calculations**. The
        chart through the day is kept for the most recent weeks only.
