spec: easy-ui/v1
title: Body
description: >-
  Weight and body composition from your weigh-ins, fitness age, water and heat acclimation.
  Each part shows only once there is something logged for it.

params:
  days:
    type: choice
    label: Period
    default: 180
    options:
      - {value: 90, label: 90 days}
      - {value: 180, label: 6 months}
      - {value: 365, label: 1 year}
      - {value: 1095, label: 3 years}

queries:
  # The latest of each, and its change against the latest one at least 28 days before it.
  latest:
    sql: |
      WITH w AS (SELECT date, weight_kg, bmi, body_fat_pct FROM days WHERE weight_kg IS NOT NULL),
      last AS (SELECT * FROM w ORDER BY date DESC LIMIT 1),
      before AS (SELECT w.* FROM w, last WHERE w.date <= date(last.date, '-28 days') ORDER BY w.date DESC LIMIT 1),
      fa AS (SELECT date, fitness_age, chronological_age, achievable_fitness_age FROM garmin_training
             WHERE fitness_age IS NOT NULL ORDER BY date DESC LIMIT 1),
      fa_before AS (SELECT t.fitness_age FROM garmin_training t, fa
                    WHERE t.fitness_age IS NOT NULL AND t.date <= date(fa.date, '-28 days') ORDER BY t.date DESC LIMIT 1)
      SELECT l.date AS weighed, l.weight_kg AS weight, l.weight_kg - b.weight_kg AS weight_change,
             l.bmi AS bmi, (SELECT body_fat_pct / 100.0 FROM w WHERE body_fat_pct IS NOT NULL ORDER BY date DESC LIMIT 1) AS fat,
             f.fitness_age AS fitness_age, f.fitness_age - fb.fitness_age AS fitness_age_change,
             f.chronological_age AS age, f.achievable_fitness_age AS achievable
      FROM (SELECT 1) one LEFT JOIN last l LEFT JOIN before b LEFT JOIN fa f LEFT JOIN fa_before fb

  # Weigh-in days only, with the average of the last seven weigh-ins.
  weight:
    sql: |
      WITH end_day AS (SELECT max(date) AS d FROM days WHERE has_data = 1 OR weight_kg IS NOT NULL)
      SELECT date AS day, weight_kg AS "Weight",
             round(avg(weight_kg) OVER (ORDER BY date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW), 2) AS "Average of 7 weigh-ins",
             body_fat_pct AS "Body fat", bmi AS "BMI"
      FROM days, end_day e
      WHERE weight_kg IS NOT NULL AND date > date(e.d, '-' || :days || ' days')
      ORDER BY date

  body_fat:
    sql: |
      WITH end_day AS (SELECT max(date) AS d FROM days WHERE has_data = 1 OR weight_kg IS NOT NULL)
      SELECT date AS day, body_fat_pct AS "Body fat"
      FROM days, end_day e
      WHERE body_fat_pct IS NOT NULL AND date > date(e.d, '-' || :days || ' days')
      ORDER BY date

  # Fitness age per week, next to the age Garmin says you could reach.
  fitness_age:
    sql: |
      WITH end_day AS (SELECT max(date) AS d FROM garmin_training WHERE fitness_age IS NOT NULL)
      SELECT date(date, 'weekday 0', '-6 days') AS week, round(avg(fitness_age), 1) AS "Fitness age",
             max(achievable_fitness_age) AS "Achievable", max(chronological_age) AS "Your age"
      FROM garmin_training, end_day e
      WHERE fitness_age IS NOT NULL AND date > date(e.d, '-' || :days || ' days')
      GROUP BY 1 ORDER BY 1

  # Water logged in Garmin Connect, on the days something was logged.
  hydration:
    sql: |
      WITH end_day AS (SELECT max(date) AS d FROM days WHERE has_data = 1)
      SELECT date AS day, round(hydration_ml / 1000.0, 2) AS "Water", round(hydration_goal_ml / 1000.0, 2) AS "Goal"
      FROM days, end_day e
      WHERE hydration_ml > 0 AND date > date(e.d, '-' || :days || ' days')
      ORDER BY date

  acclimation:
    sql: |
      WITH end_day AS (SELECT max(date) AS d FROM garmin_training)
      SELECT date AS day, heat_acclimation_pct / 100.0 AS "Heat acclimation"
      FROM garmin_training, end_day e
      WHERE heat_acclimation_pct IS NOT NULL AND date > date(e.d, '-' || :days || ' days')
      ORDER BY date

layout:
  - - type: controls

  - - type: stat
      title: Weight
      class: body
      query: latest
      value: weight
      format: decimal1
      delta: weight_change
      delta_format: decimal1
      hint: Kilograms, the latest weigh-in; the change is against the last one at least four weeks before.
    - type: stat
      title: Weighed on
      class: body
      query: latest
      value: weighed
      format: date
    - type: stat
      title: BMI
      class: body
      query: latest
      value: bmi
      format: decimal1
    - type: stat
      title: Body fat
      class: body
      query: latest
      value: fat
      format: percent
      hint: From a smart scale, when it measures it.
    - type: stat
      title: Fitness age
      class: body
      query: latest
      value: fitness_age
      format: decimal1
      delta: fitness_age_change
      delta_format: decimal1
      better: lower
      hint: Garmin's estimate from VO2 max, resting heart rate, activity and BMI; against four weeks before.
    - type: stat
      title: Fitness age within reach
      class: body
      query: latest
      value: achievable
      format: decimal1
      hint: What Garmin thinks you could reach with more vigorous activity.

  - - type: line
      title: Weight
      id: weight
      class: [body, optional, with-average]
      query: weight
      x: day
      y: [Weight, Average of 7 weigh-ins]
      format: decimal1
      unit: kg
    - type: line
      title: Body fat
      class: [body, optional]
      query: body_fat
      x: day
      y: Body fat
      format: decimal1
      unit: "%"

  - - type: line
      title: Fitness age
      id: fitness-age
      class: [body, optional, with-baselines]
      query: fitness_age
      x: week
      y: [Fitness age, Achievable, Your age]
      format: decimal1
      unit: years
    - type: bar
      title: Water per day
      class: [body, optional]
      query: hydration
      x: day
      y: Water
      format: decimal1
      unit: L
    - type: area
      title: Heat acclimation
      class: [body, optional]
      query: acclimation
      x: day
      y: Heat acclimation
      format: percent

  - - type: text
      class: notes
      body: |
        Weight, BMI and body fat come from weigh-ins in Garmin Connect (typed in, or from a
        connected scale); water from what you log there. A chart without anything logged in the
        period is hidden.

        Fitness age and heat acclimation are **Garmin's own calculations**. Fitness age moves
        slowly: look at it over months.
