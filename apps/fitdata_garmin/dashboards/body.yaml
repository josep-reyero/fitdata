spec: easy-ui/v1
title: Body
description: >-
  Weight and body composition from your weigh-ins, fitness age, water and heat acclimation. Each
  part appears once there is something logged or estimated for it.

params:
  days:
    type: choice
    label: Period
    default: 90
    options:
      - {value: 90, label: 90 days}
      - {value: 180, label: 6 months}
      - {value: 365, label: 1 year}
      - {value: 1095, label: 3 years}

queries:
  # One line for an archive with nothing on this page yet (no row once there is something).
  nothing_yet:
    sql: |
      SELECT 'Weigh-ins typed into Garmin Connect or sent by a connected scale show here as weight, BMI '
             || 'and body fat; water once you log it in the app; fitness age and heat acclimation once '
             || 'Garmin has estimated them from your activities.' AS line
      WHERE NOT EXISTS (SELECT 1 FROM days WHERE weight_kg IS NOT NULL OR hydration_ml > 0)
        AND NOT EXISTS (SELECT 1 FROM garmin_training WHERE fitness_age IS NOT NULL OR heat_acclimation_pct IS NOT NULL)

  # The latest weigh-in and its change against the latest one at least 28 days before it; the
  # latest fitness age, against four weeks before.
  latest:
    sql: |
      WITH w AS (SELECT date, weight_kg, bmi, body_fat_pct FROM days WHERE weight_kg IS NOT NULL),
      last AS (SELECT * FROM w ORDER BY date DESC LIMIT 1),
      before AS (SELECT w.* FROM w, last WHERE w.date <= date(last.date, '-28 days') ORDER BY w.date DESC LIMIT 1)
      SELECT l.date AS weighed, l.weight_kg AS weight, l.weight_kg - b.weight_kg AS weight_change,
             'Weighed ' || CAST(strftime('%d', l.date) AS INTEGER) || ' '
               || substr('JanFebMarAprMayJunJulAugSepOctNovDec', 1 + 3 * (strftime('%m', l.date) - 1), 3) AS weighed_word,
             l.bmi AS bmi,
             (SELECT body_fat_pct / 100.0 FROM w WHERE body_fat_pct IS NOT NULL ORDER BY date DESC LIMIT 1) AS fat
      FROM last l LEFT JOIN before b

  fitness_age_now:
    sql: |
      WITH fa AS (SELECT date, fitness_age, chronological_age, achievable_fitness_age FROM garmin_training
                  WHERE fitness_age IS NOT NULL ORDER BY date DESC LIMIT 1),
      fa_before AS (SELECT t.fitness_age FROM garmin_training t, fa
                    WHERE t.fitness_age IS NOT NULL AND t.date <= date(fa.date, '-28 days') ORDER BY t.date DESC LIMIT 1)
      SELECT f.fitness_age, f.fitness_age - fb.fitness_age AS fitness_age_change,
             printf('Your age %d', f.chronological_age) AS age_word,
             f.achievable_fitness_age AS achievable
      FROM fa f LEFT JOIN fa_before fb

  # Weigh-in days only, with the average of the last seven weigh-ins once there are 3.
  weight:
    sql: |
      WITH end_day AS (SELECT max(date) AS d FROM days WHERE has_data = 1 OR weight_kg IS NOT NULL)
      SELECT date AS day, weight_kg AS "Weight",
             CASE WHEN count(weight_kg) OVER w >= 3 THEN round(avg(weight_kg) OVER w, 2) END AS "Average of 7 weigh-ins",
             body_fat_pct AS "Body fat", bmi AS "BMI"
      FROM days, end_day e
      WHERE weight_kg IS NOT NULL AND date > date(e.d, '-' || :days || ' days')
      WINDOW w AS (ORDER BY date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)
      ORDER BY date

  body_fat:
    sql: |
      WITH end_day AS (SELECT max(date) AS d FROM days WHERE has_data = 1 OR weight_kg IS NOT NULL)
      SELECT date AS day, body_fat_pct AS "Body fat"
      FROM days, end_day e
      WHERE body_fat_pct IS NOT NULL AND date > date(e.d, '-' || :days || ' days')
      ORDER BY date

  # Fitness age per week, next to the age Garmin says you could reach and your own age.
  fitness_age:
    sql: |
      WITH end_day AS (SELECT max(date) AS d FROM garmin_training WHERE fitness_age IS NOT NULL)
      SELECT date(date, 'weekday 0', '-6 days') AS week, round(avg(fitness_age), 1) AS "Fitness age",
             max(achievable_fitness_age) AS "Within reach", max(chronological_age) AS "Your age"
      FROM garmin_training, end_day e
      WHERE fitness_age IS NOT NULL AND date > date(e.d, '-' || :days || ' days')
      GROUP BY 1 ORDER BY 1

  # Water logged in Garmin Connect, on the days something was logged, against the latest goal.
  hydration:
    sql: |
      WITH end_day AS (SELECT max(date) AS d FROM days WHERE has_data = 1)
      SELECT date AS day, round(hydration_ml / 1000.0, 2) AS "Water",
             (SELECT round(hydration_goal_ml / 1000.0, 2) FROM days WHERE hydration_goal_ml IS NOT NULL
              ORDER BY date DESC LIMIT 1) AS goal
      FROM days, end_day e
      WHERE hydration_ml > 0 AND date > date(e.d, '-' || :days || ' days')
      ORDER BY date

  acclimation:
    sql: |
      WITH end_day AS (SELECT max(date) AS d FROM garmin_training)
      SELECT date AS day, heat_acclimation_pct / 100.0 AS "Heat acclimation"
      FROM garmin_training, end_day e
      WHERE heat_acclimation_pct IS NOT NULL AND date > date(e.d, '-' || :days || ' days')
      ORDER BY date

layout:
  - - type: controls

  - - type: stat
      title: Nothing logged yet
      id: nothing-yet
      class: [body, empty-note]
      query: nothing_yet
      value: line
      hide_empty: true

  - - type: stat
      title: Weight
      class: body
      query: latest
      value: weight
      format: decimal1
      delta: weight_change
      delta_format: decimal1
      note: weighed_word
      hint: Kilograms
      hide_empty: true
    - type: stat
      title: BMI
      class: body
      query: latest
      value: bmi
      format: decimal1
      hide_empty: true
    - type: stat
      title: Body fat
      class: body
      query: latest
      value: fat
      format: percent
      hide_empty: true
    - type: stat
      title: Fitness age
      class: body
      query: fitness_age_now
      value: fitness_age
      format: decimal1
      delta: fitness_age_change
      delta_format: decimal1
      better: lower
      note: age_word
      hide_empty: true
    - type: stat
      title: Fitness age within reach
      class: body
      query: fitness_age_now
      value: achievable
      format: decimal1
      hide_empty: true

  - - type: line
      title: Weight
      id: weight
      class: [body, with-average]
      query: weight
      x: day
      y: [Weight, Average of 7 weigh-ins]
      dashed: Average of 7 weigh-ins
      format: decimal1
      unit: kg
      hide_empty: true
    - type: line
      title: Body fat
      id: body-fat
      class: body
      query: body_fat
      x: day
      y: Body fat
      format: decimal1
      unit: "%"
      hide_empty: true

  - - type: line
      title: Fitness age
      id: fitness-age
      class: [body, with-average]
      query: fitness_age
      x: week
      y: [Fitness age, Within reach, Your age]
      dashed: [Within reach, Your age]
      format: decimal1
      unit: years
      hide_empty: true
    - type: bar
      title: Water per day
      id: water
      class: body
      query: hydration
      x: day
      y: Water
      format: decimal1
      unit: L
      reference: {column: goal, label: Goal}
      hide_empty: true
    - type: area
      title: Heat acclimation
      id: heat
      class: body
      query: acclimation
      x: day
      y: Heat acclimation
      format: percent
      hide_empty: true

  - - type: text
      class: notes
      body: |
        The change under the weight is against the last weigh-in at least four weeks before.
        Fitness age and heat acclimation are **Garmin's own calculations**; fitness age moves
        slowly, so look at it over months.
