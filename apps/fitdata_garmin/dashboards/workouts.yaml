spec: easy-ui/v1
title: Workouts
description: >-
  Your workouts, how training is going, and how much you moved each day.

params:
  day:
    type: date
    label: Day
    default: today
  days:
    type: choice
    label: Period
    default: 30
    options:
      - {value: 30, label: 30 days}
      - {value: 90, label: 90 days}
      - {value: 180, label: 6 months}
      - {value: 365, label: 1 year}

queries:
  # One line for an archive without any workout yet, and one for a period without any (no row
  # otherwise).
  no_workouts:
    sql: |
      SELECT 'Start an activity on the watch (a walk, a run, a ride or a gym session) and it shows '
             || 'here after the next sync. Training load, status and VO2 max follow after a few weeks of them.' AS line
      WHERE NOT EXISTS (SELECT 1 FROM activities)

  none_in_period:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(d) FROM (SELECT max(date) AS d FROM days WHERE has_data = 1
                                              UNION ALL SELECT max(date) FROM activities))) AS d
      )
      SELECT 'Choose a longer Period to see earlier ones.' AS line
      FROM sel
      WHERE EXISTS (SELECT 1 FROM activities)
        AND NOT EXISTS (SELECT 1 FROM activities a WHERE a.date > date(sel.d, '-' || :days || ' days') AND a.date <= sel.d)

  # The chosen day's (or the most recent day's) training numbers. Readiness against your usual
  # (the average of the days before it, up to 28, once there are 3); training status and load as
  # of the latest report up to that day; VO2 max against four weeks before.
  today:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      usual AS (
        SELECT avg(t.readiness) AS ready, count(t.readiness) AS n_ready FROM garmin_training t, sel
        WHERE t.date >= date(sel.d, '-28 days') AND t.date < sel.d
      ),
      last_load AS (
        SELECT t.* FROM garmin_training t, sel WHERE t.date <= sel.d AND t.acute_load IS NOT NULL
        ORDER BY t.date DESC LIMIT 1
      ),
      vo2 AS (
        SELECT (SELECT vo2max_running FROM garmin_training t WHERE t.date <= sel.d AND vo2max_running IS NOT NULL
                ORDER BY t.date DESC LIMIT 1) AS now,
               (SELECT vo2max_running FROM garmin_training t WHERE t.date <= date(sel.d, '-28 days')
                AND vo2max_running IS NOT NULL ORDER BY t.date DESC LIMIT 1) AS before
        FROM sel
      )
      SELECT t.readiness AS ready, CASE WHEN u.n_ready >= 3 THEN t.readiness - u.ready END AS ready_change,
             upper(substr(t.readiness_level, 1, 1)) || lower(substr(t.readiness_level, 2)) AS ready_word,
             upper(substr(replace(l.status, '_', ' '), 1, 1)) || lower(substr(replace(l.status, '_', ' '), 2)) AS status,
             CASE WHEN l.status IS NOT NULL THEN 'Garmin''s verdict' END AS status_word,
             l.acute_load AS acute,
             CASE WHEN l.chronic_load_min IS NOT NULL
                  THEN printf('Optimal %d–%d', l.chronic_load_min, l.chronic_load_max) END AS acute_word,
             v.now AS vo2, v.now - v.before AS vo2_change,
             CASE WHEN v.now IS NOT NULL THEN 'Running fitness' END AS vo2_word
      FROM sel LEFT JOIN garmin_training t ON t.date = sel.d LEFT JOIN last_load l, usual u, vo2 v

  # Every app's activities in the period, the latest first.
  recent:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(d) FROM (SELECT max(date) AS d FROM days WHERE has_data = 1
                                              UNION ALL SELECT max(date) FROM activities))) AS d
      )
      SELECT date AS day,
             upper(substr(replace(coalesce(type, 'activity'), '_', ' '), 1, 1))
               || substr(replace(coalesce(type, 'activity'), '_', ' '), 2) AS sport,
             duration_s AS duration, nullif(distance_m, 0) AS distance, avg_hr,
             upper(substr(replace(te_label, '_', ' '), 1, 1)) || lower(substr(replace(te_label, '_', ' '), 2)) AS effect,
             training_load
      FROM activities, sel
      WHERE date > date(sel.d, '-' || :days || ' days') AND date <= sel.d
      ORDER BY start_local DESC, id DESC

  # Time per week (from the first week with an activity), in four groups of sports, always in the
  # same order so each keeps its colour.
  weekly:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(d) FROM (SELECT max(date) AS d FROM days WHERE has_data = 1
                                              UNION ALL SELECT max(date) FROM activities))) AS d
      ),
      a AS (
        SELECT date(date, 'weekday 0', '-6 days') AS week,
               CASE WHEN type LIKE '%running%' THEN 'run'
                    WHEN type LIKE '%cycling%' OR type LIKE '%biking%' OR type LIKE '%ride%' THEN 'ride'
                    WHEN type LIKE '%walking%' OR type LIKE '%hiking%' THEN 'walk' ELSE 'other' END AS sport,
               duration_s
        FROM activities, sel
        WHERE date > date(sel.d, '-' || :days || ' days') AND date <= sel.d
      ),
      weeks AS (
        SELECT DISTINCT date(d.date, 'weekday 0', '-6 days') AS week FROM days d, sel
        WHERE d.date > date(sel.d, '-' || :days || ' days') AND d.date <= sel.d
          AND date(d.date, 'weekday 0', '-6 days') >= (SELECT min(week) FROM a)
      )
      SELECT w.week AS week,
             total(CASE WHEN a.sport = 'run' THEN a.duration_s END) AS "Running",
             total(CASE WHEN a.sport = 'ride' THEN a.duration_s END) AS "Cycling",
             total(CASE WHEN a.sport = 'walk' THEN a.duration_s END) AS "Walking and hiking",
             total(CASE WHEN a.sport = 'other' THEN a.duration_s END) AS "Other"
      FROM weeks w LEFT JOIN a ON a.week = w.week
      GROUP BY w.week
      ORDER BY w.week

  # The period's workouts per sport, the sport with the most time first.
  by_sport:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(d) FROM (SELECT max(date) AS d FROM days WHERE has_data = 1
                                              UNION ALL SELECT max(date) FROM activities))) AS d
      )
      SELECT upper(substr(replace(coalesce(type, 'activity'), '_', ' '), 1, 1))
               || substr(replace(coalesce(type, 'activity'), '_', ' '), 2) AS sport,
             count(*) AS workouts, total(duration_s) AS time
      FROM activities, sel
      WHERE date > date(sel.d, '-' || :days || ' days') AND date <= sel.d
      GROUP BY 1
      ORDER BY time DESC, sport

  # Acute load (the last 7 days) against Garmin's optimal range, one row per day with a report.
  load:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT t.date AS day, t.acute_load AS "Acute load",
             t.chronic_load_min AS optimal_low, t.chronic_load_max AS optimal_high
      FROM garmin_training t, sel
      WHERE t.acute_load IS NOT NULL AND t.date > date(sel.d, '-' || :days || ' days') AND t.date <= sel.d
      ORDER BY t.date

  # Steps per recorded day of the period against the latest goal; the latest day (usually still in
  # progress) is drawn lighter.
  steps:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d,
               (SELECT max(date) FROM days WHERE has_data = 1) AS latest
      )
      SELECT d.date AS day, nullif(d.steps, 0) AS "Steps",
             (SELECT steps_goal FROM days WHERE date <= sel.d AND steps_goal IS NOT NULL
              ORDER BY date DESC LIMIT 1) AS goal,
             CASE WHEN d.date = sel.latest THEN 1 ELSE 0 END AS in_progress
      FROM days d, sel
      WHERE d.has_data = 1 AND d.date > date(sel.d, '-' || :days || ' days') AND d.date <= sel.d
      ORDER BY d.date

  # Intensity minutes per week (Monday to Sunday): Garmin counts vigorous minutes twice.
  intensity:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT date(d.date, 'weekday 0', '-6 days') AS week,
             total(d.moderate_minutes) AS "Moderate",
             2 * total(d.vigorous_minutes) AS "Vigorous, counted twice",
             (SELECT intensity_week_goal FROM garmin_daily WHERE date <= sel.d AND intensity_week_goal IS NOT NULL
              ORDER BY date DESC LIMIT 1) AS goal,
             max(CASE WHEN date(d.date, 'weekday 0', '-6 days') = date(sel.d, 'weekday 0', '-6 days')
                      AND sel.d < date(sel.d, 'weekday 0') THEN 1 ELSE 0 END) AS in_progress
      FROM days d, sel
      WHERE d.has_data = 1 AND d.date > date(sel.d, '-' || :days || ' days') AND d.date <= sel.d
      GROUP BY 1
      ORDER BY 1

layout:
  - - type: controls

  - - type: stat
      title: Training readiness
      class: training
      query: today
      value: ready
      format: integer
      delta: ready_change
      delta_format: integer
      better: higher
      note: ready_word
      hide_empty: true
    - type: stat
      title: Training status
      class: training
      query: today
      value: status
      note: status_word
      hide_empty: true
    - type: stat
      title: Training load, 7 days
      class: training
      query: today
      value: acute
      format: integer
      note: acute_word
      hide_empty: true
    - type: stat
      title: VO2 max
      class: training
      query: today
      value: vo2
      format: decimal1
      delta: vo2_change
      better: higher
      note: vo2_word
      hide_empty: true

  - - type: stat
      title: No workouts recorded yet
      id: no-workouts
      class: [training, empty-note]
      query: no_workouts
      value: line
      hide_empty: true
  - - type: stat
      title: No workouts in this period
      id: none-in-period
      class: [training, empty-note]
      query: none_in_period
      value: line
      hide_empty: true

  - - type: table
      title: Recent workouts
      id: workouts
      class: training
      query: recent
      limit: 15
      phone: scroll
      hide_empty: true
      columns:
        - {column: day, label: Date, format: date}
        - {column: sport, label: Sport}
        - {column: duration, label: Time, format: duration}
        - {column: distance, label: Distance, format: distance}
        - {column: avg_hr, label: Avg heart rate, format: integer}
        - {column: effect, label: Effect}
        - {column: training_load, label: Load, format: integer}

  - - type: bar
      title: Time per week
      id: sports-week
      class: [training, sports]
      query: weekly
      x: week
      y: [Running, Cycling, Walking and hiking, Other]
      format: duration
      stacked: true
      readout: pointer
      hide_empty: true
    - type: table
      title: By sport
      id: sports-total
      class: training
      query: by_sport
      phone: scroll
      hide_empty: true
      columns:
        - {column: sport, label: Sport}
        - {column: workouts, label: Workouts, format: integer}
        - {column: time, label: Time, format: duration}
    - type: line
      title: Training load
      id: load-range
      class: training
      query: load
      x: day
      y: Acute load
      band: {low: optimal_low, high: optimal_high, label: Optimal range}
      format: integer
      hide_empty: true

  - - type: bar
      title: Steps per day
      id: steps-days
      class: activity
      query: steps
      x: day
      y: Steps
      format: integer
      partial: in_progress
      reference: {column: goal, label: Step goal}
      hide_empty: true
    - type: bar
      title: Intensity minutes per week
      id: intensity-week
      class: [activity, pair-intensity]
      query: intensity
      x: week
      y: [Moderate, "Vigorous, counted twice"]
      format: integer
      unit: min
      stacked: true
      partial: in_progress
      reference: {column: goal, label: Weekly goal}
      hide_empty: true

  - - type: text
      class: notes
      body: |
        Training load is the effort of the last 7 days; inside the shaded range builds fitness.
        Readiness, status, load, effect and VO2 max are Garmin's own.
