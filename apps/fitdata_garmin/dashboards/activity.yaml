spec: easy-ui/v1
title: Activity
description: >-
  How much you moved: steps against your goal, intensity minutes against the weekly target,
  floors and calories, through the day and day by day.

params:
  day:
    type: date
    label: Day
    default: today
  days:
    type: choice
    label: Period
    default: 14
    options:
      - {value: 14, label: 2 weeks}
      - {value: 30, label: 30 days}
      - {value: 90, label: 90 days}
      - {value: 365, label: 1 year}

queries:
  today:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT nullif(d.steps, 0) AS steps, nullif(d.steps, 0) - d.steps_goal AS steps_vs_goal,
             CASE WHEN d.steps_goal IS NOT NULL THEN printf('Goal %,d', d.steps_goal) END AS steps_word,
             nullif(d.distance_m, 0) AS distance,
             d.floors_up AS floors, d.floors_up - g.floors_goal AS floors_vs_goal,
             CASE WHEN g.floors_goal IS NOT NULL THEN printf('Goal %g', g.floors_goal) END AS floors_word,
             d.active_calories AS active_kcal,
             g.intensity_week_total AS week_minutes, g.intensity_week_total - g.intensity_week_goal AS week_vs_goal,
             CASE WHEN g.intensity_week_goal IS NOT NULL THEN printf('Goal %d', g.intensity_week_goal) END AS week_word
      FROM sel LEFT JOIN days d ON d.date = sel.d AND d.has_data = 1 LEFT JOIN garmin_daily g ON g.date = sel.d

  # The period's averages over the days it has so far, against the same number of days before it
  # (only when those have at least 3 days with steps). The archive's latest day is usually still in
  # progress, so it is left out of both.
  period:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d,
               (SELECT max(date) FROM days WHERE has_data = 1) AS latest
      ),
      x AS (
        SELECT CASE WHEN d.date > date(sel.d, '-' || :days || ' days') THEN 1 ELSE 0 END AS recent,
               nullif(d.steps, 0) AS steps, d.steps_goal, nullif(d.active_calories, 0) AS active, d.floors_up
        FROM days d, sel
        WHERE d.has_data = 1 AND d.date > date(sel.d, '-' || (2 * :days) || ' days') AND d.date <= sel.d
          AND d.date < sel.latest
      ),
      a AS (
        SELECT avg(CASE WHEN recent = 1 THEN steps END) AS steps, avg(CASE WHEN recent = 0 THEN steps END) AS steps_before,
               count(CASE WHEN recent = 0 THEN steps END) AS n_before,
               sum(CASE WHEN recent = 1 AND steps >= steps_goal THEN 1 ELSE 0 END) AS goal_days,
               count(CASE WHEN recent = 1 THEN steps END) AS step_days,
               avg(CASE WHEN recent = 1 THEN active END) AS active, avg(CASE WHEN recent = 0 THEN active END) AS active_before,
               total(CASE WHEN recent = 1 THEN floors_up END) AS floors
        FROM x
      )
      SELECT steps, CASE WHEN n_before >= 3 THEN steps - steps_before END AS steps_change,
             CASE WHEN step_days > 0 THEN goal_days END AS goal_days,
             step_days,
             CASE WHEN step_days > 0 THEN printf('Over %d day%s', step_days, CASE WHEN step_days = 1 THEN '' ELSE 's' END)
                  END AS days_word,
             CASE WHEN step_days > 0 THEN printf('Of %d day%s', step_days, CASE WHEN step_days = 1 THEN '' ELSE 's' END)
                  END AS of_days,
             active, CASE WHEN n_before >= 3 THEN active - active_before END AS active_change,
             CASE WHEN step_days > 0 THEN floors END AS floors
      FROM a

  # Steps in each quarter of an hour of the chosen day.
  through_the_day:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT substr(s.at, 12, 5) AS time, s.value AS "Steps"
      FROM garmin_samples s, sel
      WHERE s.date = sel.d AND s.series = 'steps'
      ORDER BY s.at

  # One row per day of the period. The goals are the latest ones, drawn as a line across the chart.
  daily:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d,
               (SELECT max(date) FROM days WHERE has_data = 1) AS latest
      ),
      goals AS (
        SELECT (SELECT steps_goal FROM days WHERE date <= sel.d AND steps_goal IS NOT NULL
                ORDER BY date DESC LIMIT 1) AS steps,
               (SELECT floors_goal FROM garmin_daily WHERE date <= sel.d AND floors_goal IS NOT NULL
                ORDER BY date DESC LIMIT 1) AS floors
        FROM sel
      )
      SELECT d.date AS day,
             CASE WHEN d.has_data = 1 THEN nullif(d.steps, 0) END AS "Steps",
             goals.steps AS steps_goal,
             CASE WHEN d.date = sel.latest THEN 1 ELSE 0 END AS in_progress,
             CASE WHEN d.has_data = 1 THEN d.floors_up END AS "Floors",
             goals.floors AS floors_goal,
             d.resting_calories AS "Resting", CASE WHEN d.has_data = 1 THEN d.active_calories END AS "Active",
             g.highly_active_seconds AS "Highly active",
             g.active_seconds AS "Lightly active",
             g.sedentary_seconds AS "Sitting"
      FROM days d LEFT JOIN garmin_daily g ON g.date = d.date, sel, goals
      WHERE d.date > date(sel.d, '-' || :days || ' days') AND d.date <= sel.d
      ORDER BY d.date

  # Intensity minutes per week (Monday to Sunday): Garmin counts vigorous minutes twice.
  weekly:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT date(d.date, 'weekday 0', '-6 days') AS week,
             total(d.moderate_minutes) AS "Moderate",
             2 * total(d.vigorous_minutes) AS "Vigorous, counted twice",
             (SELECT intensity_week_goal FROM garmin_daily WHERE date <= sel.d AND intensity_week_goal IS NOT NULL
              ORDER BY date DESC LIMIT 1) AS goal,
             max(CASE WHEN date(d.date, 'weekday 0', '-6 days') = date(sel.d, 'weekday 0', '-6 days')
                      AND sel.d < date(sel.d, 'weekday 0') THEN 1 ELSE 0 END) AS in_progress
      FROM days d, sel
      WHERE d.has_data = 1 AND d.date > date(sel.d, '-' || max(:days, 28) || ' days') AND d.date <= sel.d
      GROUP BY 1
      ORDER BY 1

layout:
  - - type: controls

  - - type: stat
      title: Steps
      class: activity
      query: today
      value: steps
      format: integer
      delta: steps_vs_goal
      better: higher
      note: steps_word
    - type: stat
      title: Distance
      class: activity
      query: today
      value: distance
      format: distance
    - type: stat
      title: Floors climbed
      class: activity
      query: today
      value: floors
      format: integer
      delta: floors_vs_goal
      better: higher
      note: floors_word
    - type: stat
      title: Active calories
      class: activity
      query: today
      value: active_kcal
      format: integer
      hint: Kilocalories
    - type: stat
      title: Intensity minutes this week
      class: activity
      query: today
      value: week_minutes
      format: integer
      delta: week_vs_goal
      better: higher
      note: week_word

  - - type: stat
      title: Steps per day
      class: activity
      query: period
      value: steps
      format: integer
      delta: steps_change
      better: higher
      note: days_word
      hide_empty: true
    - type: stat
      title: Days at the step goal
      class: activity
      query: period
      value: goal_days
      format: integer
      note: of_days
      hide_empty: true
    - type: stat
      title: Active calories per day
      class: activity
      query: period
      value: active
      format: integer
      delta: active_change
      better: higher
      note: days_word
      hide_empty: true
    - type: stat
      title: Floors in the period
      class: activity
      query: period
      value: floors
      format: integer
      note: days_word
      hide_empty: true

  - - type: bar
      title: Steps through the day
      id: steps-day
      class: activity
      query: through_the_day
      x: time
      y: Steps
      format: integer
      readout: pointer
      hide_empty: true
    - type: bar
      title: Steps per day
      id: steps-days
      class: activity
      query: daily
      x: day
      y: Steps
      format: integer
      partial: in_progress
      reference: {column: steps_goal, label: Step goal}
      hide_empty: true

  - - type: bar
      title: Intensity minutes per week
      id: intensity-week
      class: [activity, pair-intensity]
      query: weekly
      x: week
      y: [Moderate, "Vigorous, counted twice"]
      format: integer
      unit: min
      stacked: true
      partial: in_progress
      reference: {column: goal, label: Weekly goal}
      hide_empty: true
    - type: bar
      title: Floors climbed per day
      id: floors-days
      class: activity
      query: daily
      x: day
      y: Floors
      format: integer
      partial: in_progress
      reference: {column: floors_goal, label: Floors goal}
      hide_empty: true

  - - type: bar
      title: Calories per day
      id: calories
      class: [activity, pair-calories]
      query: daily
      x: day
      y: [Resting, Active]
      format: integer
      unit: kcal
      stacked: true
      partial: in_progress
      hide_empty: true
    - type: bar
      title: Time active and sitting per day
      id: active-time
      class: [activity, three-levels]
      query: daily
      x: day
      y: [Highly active, Lightly active, Sitting]
      format: duration
      stacked: true
      partial: in_progress
      hide_empty: true

  - - type: text
      class: notes
      body: |
        The latest day is usually still in progress: its bars are drawn lighter and it is left out
        of the period's averages, which count only the days the watch recorded so far (the small
        line under each says how many). Their arrows compare with the same number of days before,
        once those have 3 days. **Intensity minutes** count moderate activity once and vigorous
        activity twice; the usual target is 150 a week. Step goal, intensity minutes and calories
        are **Garmin's own calculations**.
