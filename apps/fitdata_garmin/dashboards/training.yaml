spec: easy-ui/v1
title: Training
description: >-
  Whether you are ready to train, how your load compares with what you are used to, how your
  fitness is moving, and what you did.

params:
  day:
    type: date
    label: Day
    default: today
  days:
    type: choice
    label: Period
    default: 30
    options:
      - {value: 30, label: 30 days}
      - {value: 90, label: 90 days}
      - {value: 180, label: 6 months}
      - {value: 365, label: 1 year}

queries:
  # One line for an archive without any activity yet (no row at all once there is one).
  no_activities:
    sql: |
      SELECT 'Start one from the watch (a walk, a run, a ride or a workout) and it shows here after the next '
             || 'sync. Training load, training status, VO2 max and race predictions follow once Garmin has '
             || 'a few weeks of activities; readiness needs only your sleep.' AS line
      WHERE NOT EXISTS (SELECT 1 FROM activities)

  # The chosen day (or the most recent one with data), its readiness against your usual (the
  # average of the days before it, up to 28, once there are 3). VO2 max is the latest Garmin had on
  # or before that day: it changes only after some activities.
  today:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      usual AS (
        SELECT avg(t.readiness) AS ready, count(t.readiness) AS n_ready FROM garmin_training t, sel
        WHERE t.date >= date(sel.d, '-28 days') AND t.date < sel.d
      ),
      latest AS (
        SELECT (SELECT vo2max_running FROM garmin_training t WHERE t.date <= sel.d AND vo2max_running IS NOT NULL
                ORDER BY t.date DESC LIMIT 1) AS vo2,
               (SELECT vo2max_running FROM garmin_training t WHERE t.date <= date(sel.d, '-28 days')
                AND vo2max_running IS NOT NULL ORDER BY t.date DESC LIMIT 1) AS vo2_before
        FROM sel
      )
      SELECT t.readiness AS ready, CASE WHEN u.n_ready >= 3 THEN t.readiness - u.ready END AS ready_change,
             upper(substr(t.readiness_level, 1, 1)) || lower(substr(t.readiness_level, 2)) AS ready_word,
             (t.recovery_time_minutes + 59) / 60 AS recovery,
             CASE WHEN t.recovery_time_minutes = 0 THEN 'Fully recovered' END AS recovery_word,
             upper(substr(replace(t.status, '_', ' '), 1, 1)) || lower(substr(replace(t.status, '_', ' '), 2)) AS status_word,
             t.acute_load AS acute, l.vo2 AS vo2, l.vo2 - l.vo2_before AS vo2_change
      FROM sel LEFT JOIN garmin_training t ON t.date = sel.d, usual u, latest l

  # The parts of the morning's readiness score.
  factors:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      t AS (SELECT * FROM garmin_training, sel WHERE date = sel.d),
      f AS (
        SELECT 1 AS k, 'Sleep score' AS factor, sleep_factor_pct AS pct, sleep_factor AS word FROM t
        UNION ALL SELECT 2, 'Sleep history', sleep_history_factor_pct, sleep_history_factor FROM t
        UNION ALL SELECT 3, 'Recovery time', recovery_factor_pct, recovery_factor FROM t
        UNION ALL SELECT 4, 'Acute load', load_factor_pct, load_factor FROM t
        UNION ALL SELECT 5, 'HRV status', hrv_factor_pct, hrv_factor FROM t
        UNION ALL SELECT 6, 'Stress history', stress_factor_pct, stress_factor FROM t
      )
      SELECT factor, pct / 100.0 AS pct,
             CASE WHEN word LIKE 'GOOD%' OR word LIKE 'OPTIMAL%' OR word LIKE 'VERY_GOOD%' THEN 'Good'
                  WHEN word LIKE 'MODERATE%' OR word LIKE 'FAIR%' THEN 'Moderate'
                  WHEN word IS NOT NULL THEN 'Holding you back' END AS verdict
      FROM f WHERE pct IS NOT NULL OR word IS NOT NULL
      ORDER BY k

  # Garmin's four-week load focus: each kind of load against its target range.
  balance:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      t AS (
        SELECT * FROM garmin_training, sel WHERE date <= sel.d AND aerobic_low_load IS NOT NULL
        ORDER BY date DESC LIMIT 1
      ),
      b AS (
        SELECT 1 AS k, 'Anaerobic' AS kind, anaerobic_load AS load, anaerobic_target_min AS lo, anaerobic_target_max AS hi FROM t
        UNION ALL SELECT 2, 'High aerobic', aerobic_high_load, aerobic_high_target_min, aerobic_high_target_max FROM t
        UNION ALL SELECT 3, 'Low aerobic', aerobic_low_load, aerobic_low_target_min, aerobic_low_target_max FROM t
      )
      SELECT kind, load AS "Load", CASE WHEN lo IS NOT NULL THEN printf('%d–%d', lo, hi) END AS target,
             CASE WHEN load < lo THEN 'Below: room for more' WHEN load > hi THEN 'Above the range' ELSE 'In range' END AS verdict
      FROM b ORDER BY k

  # One row per day with a training report. The 7-day average appears once 3 of the 7 days have one.
  daily:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      x AS (
        SELECT t.date, t.readiness, avg(t.readiness) OVER w AS ready_7d, count(t.readiness) OVER w AS n_7d,
               t.acute_load, t.chronic_load, t.chronic_load_min, t.chronic_load_max, t.vo2max_running,
               t.endurance_score, t.hill_score
        FROM garmin_training t
        WINDOW w AS (ORDER BY julianday(t.date) RANGE BETWEEN 6 PRECEDING AND CURRENT ROW)
      )
      SELECT x.date AS day, x.readiness AS "Training readiness",
             CASE WHEN x.n_7d >= 3 THEN round(x.ready_7d, 1) END AS "7-day average",
             x.acute_load AS "Acute load", x.chronic_load AS "Chronic load",
             x.chronic_load_min AS optimal_low, x.chronic_load_max AS optimal_high,
             x.endurance_score AS "Endurance score", x.hill_score AS "Hill score"
      FROM x, sel
      WHERE x.date > date(sel.d, '-' || :days || ' days') AND x.date <= sel.d
      ORDER BY x.date

  # VO2 max per week: the latest value Garmin had by the end of each week.
  fitness:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      )
      SELECT date(t.date, 'weekday 0', '-6 days') AS week,
             max(t.vo2max_running) AS "VO2 max, running", max(t.vo2max_cycling) AS "VO2 max, cycling"
      FROM garmin_training t, sel
      WHERE t.date > date(sel.d, '-' || :days || ' days') AND t.date <= sel.d
      GROUP BY 1
      ORDER BY 1

  # Predicted race times now and four weeks before (no rows until Garmin has predicted any).
  races:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(date) FROM days WHERE has_data = 1)) AS d
      ),
      now AS (SELECT * FROM garmin_training, sel WHERE date <= sel.d AND race_5k_seconds IS NOT NULL ORDER BY date DESC LIMIT 1),
      before AS (SELECT * FROM garmin_training, sel WHERE date <= date(sel.d, '-28 days') AND race_5k_seconds IS NOT NULL
                 ORDER BY date DESC LIMIT 1),
      r AS (
        SELECT 1 AS k, '5 km' AS race, n.race_5k_seconds AS now, b.race_5k_seconds AS before FROM now n LEFT JOIN before b
        UNION ALL SELECT 2, '10 km', n.race_10k_seconds, b.race_10k_seconds FROM now n LEFT JOIN before b
        UNION ALL SELECT 3, 'Half marathon', n.race_half_seconds, b.race_half_seconds FROM now n LEFT JOIN before b
        UNION ALL SELECT 4, 'Marathon', n.race_marathon_seconds, b.race_marathon_seconds FROM now n LEFT JOIN before b
      )
      SELECT race, now, before, now - before AS change FROM r ORDER BY k

  # Every app's activities in the period, by sport: time per week (from the first week with an
  # activity) and time per sport. Every sport is listed, in a fixed order, so it keeps its colour.
  weekly:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(d) FROM (SELECT max(date) AS d FROM days WHERE has_data = 1
                                              UNION ALL SELECT max(date) FROM activities))) AS d
      ),
      a AS (
        SELECT date(date, 'weekday 0', '-6 days') AS week,
               CASE WHEN type LIKE '%running%' THEN 'run'
                    WHEN type LIKE '%cycling%' OR type LIKE '%biking%' OR type LIKE '%ride%' THEN 'ride'
                    WHEN type LIKE '%walking%' OR type LIKE '%hiking%' THEN 'walk' ELSE 'other' END AS sport,
               nullif(distance_m, 0) AS distance_m, duration_s, training_load
        FROM activities, sel
        WHERE date > date(sel.d, '-' || :days || ' days') AND date <= sel.d
      ),
      weeks AS (
        SELECT DISTINCT date(d.date, 'weekday 0', '-6 days') AS week FROM days d, sel
        WHERE d.date > date(sel.d, '-' || :days || ' days') AND d.date <= sel.d
          AND date(d.date, 'weekday 0', '-6 days') >= (SELECT min(week) FROM a)
      )
      SELECT w.week AS week,
             total(CASE WHEN a.sport = 'run' THEN a.duration_s END) AS "Running",
             total(CASE WHEN a.sport = 'ride' THEN a.duration_s END) AS "Cycling",
             total(CASE WHEN a.sport = 'walk' THEN a.duration_s END) AS "Walking and hiking",
             total(CASE WHEN a.sport = 'other' THEN a.duration_s END) AS "Other",
             round(total(a.distance_m) / 1000, 1) AS "Distance",
             round(total(a.training_load)) AS "Training load"
      FROM weeks w LEFT JOIN a ON a.week = w.week
      GROUP BY w.week
      ORDER BY w.week

  by_sport:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(d) FROM (SELECT max(date) AS d FROM days WHERE has_data = 1
                                              UNION ALL SELECT max(date) FROM activities))) AS d
      ),
      a AS (
        SELECT CASE WHEN type LIKE '%running%' THEN 1
                    WHEN type LIKE '%cycling%' OR type LIKE '%biking%' OR type LIKE '%ride%' THEN 2
                    WHEN type LIKE '%walking%' OR type LIKE '%hiking%' THEN 3 ELSE 4 END AS k, duration_s
        FROM activities, sel
        WHERE date > date(sel.d, '-' || :days || ' days') AND date <= sel.d
      ),
      sports(k, sport) AS (VALUES (1, 'Running'), (2, 'Cycling'), (3, 'Walking and hiking'), (4, 'Other'))
      SELECT s.sport, total(a.duration_s) AS "Time", count(a.k) AS activities
      FROM sports s LEFT JOIN a ON a.k = s.k
      WHERE EXISTS (SELECT 1 FROM a)
      GROUP BY s.k
      ORDER BY s.k

  recent:
    sql: |
      WITH sel AS (
        SELECT min(:day, (SELECT max(d) FROM (SELECT max(date) AS d FROM days WHERE has_data = 1
                                              UNION ALL SELECT max(date) FROM activities))) AS d
      )
      SELECT date AS day,
             upper(substr(replace(coalesce(type, 'activity'), '_', ' '), 1, 1))
               || substr(replace(coalesce(type, 'activity'), '_', ' '), 2) AS kind,
             nullif(distance_m, 0) AS distance, duration_s AS duration,
             CASE WHEN type LIKE '%running%' AND distance_m > 0
                  THEN coalesce(moving_s, duration_s) * 1000.0 / distance_m END AS pace,
             avg_hr, aerobic_te, training_load
      FROM activities, sel
      WHERE date > date(sel.d, '-' || :days || ' days') AND date <= sel.d
      ORDER BY start_local DESC, id DESC

layout:
  - - type: controls

  - - type: stat
      title: No activities yet
      id: no-activities
      class: [training, empty-note]
      query: no_activities
      value: line
      hide_empty: true

  - - type: stat
      title: Training readiness
      class: training
      query: today
      value: ready
      format: integer
      delta: ready_change
      delta_format: integer
      better: higher
      note: ready_word
      hint: Out of 100
      hide_empty: true
    - type: stat
      title: Recovery time
      class: training
      query: today
      value: recovery
      format: integer
      note: recovery_word
      hint: Hours
      hide_empty: true
    - type: stat
      title: Acute load
      class: training
      query: today
      value: acute
      format: integer
      note: status_word
      hint: The last 7 days
      hide_empty: true
    - type: stat
      title: VO2 max
      class: training
      query: today
      value: vo2
      format: decimal1
      delta: vo2_change
      better: higher
      hint: Running
      hide_empty: true

  - - type: table
      title: What shapes your readiness
      id: factors
      class: training
      query: factors
      hide_empty: true
      columns:
        - {column: factor, label: Factor}
        - {column: pct, label: Contribution, format: percent}
        - {column: verdict, label: Garmin's view}
    - type: line
      title: Training readiness
      id: readiness-days
      class: [training, with-average]
      query: daily
      x: day
      y: [Training readiness, 7-day average]
      dashed: 7-day average
      format: integer
      hide_empty: true

  - - type: line
      title: Acute load against its optimal range
      id: load-range
      class: [training, with-average]
      query: daily
      x: day
      y: [Acute load, Chronic load]
      dashed: Chronic load
      band: {low: optimal_low, high: optimal_high, label: Optimal range}
      format: integer
      hide_empty: true
    - type: bar
      title: Load focus, last four weeks
      id: load-focus
      class: [training, load-focus]
      query: balance
      x: kind
      y: Load
      format: integer
      colors_by: kind
      hide_empty: true
    - type: table
      title: Against Garmin's targets
      id: balance
      class: training
      query: balance
      hide_empty: true
      columns:
        - {column: kind, label: Kind of load}
        - {column: target, label: Target}
        - {column: verdict, label: Where it stands}

  - - type: line
      title: VO2 max per week
      id: vo2-weeks
      class: [training, pair-sports]
      query: fitness
      x: week
      y: ["VO2 max, running", "VO2 max, cycling"]
      format: decimal1
      hide_empty: true
    - type: line
      title: Endurance score
      id: endurance
      class: training
      query: daily
      x: day
      y: Endurance score
      format: integer
      hide_empty: true
    - type: line
      title: Hill score
      id: hill
      class: training
      query: daily
      x: day
      y: Hill score
      format: integer
      hide_empty: true

  - - type: bar
      title: Training time per week
      id: sports-week
      class: [training, sports]
      query: weekly
      x: week
      y: [Running, Cycling, Walking and hiking, Other]
      format: duration
      stacked: true
      hide_empty: true
    - type: bar
      title: Training time by sport
      id: sports-total
      class: [training, sports]
      query: by_sport
      x: sport
      y: Time
      format: duration
      colors_by: sport
      hide_empty: true
    - type: table
      title: Race predictions
      id: races
      class: training
      query: races
      hide_empty: true
      columns:
        - {column: race, label: Race}
        - {column: now, label: Predicted, format: duration}
        - {column: change, label: Change in 4 weeks, format: duration}

  - - type: table
      title: Activities in the period
      id: activities
      class: training
      query: recent
      limit: 50
      hide_empty: true
      columns:
        - {column: day, label: Date, format: date}
        - {column: kind, label: Type}
        - {column: distance, label: Distance, format: distance}
        - {column: duration, label: Time, format: duration}
        - {column: pace, label: Pace, format: pace}
        - {column: aerobic_te, label: Effect, format: decimal1}
        - {column: training_load, label: Load, format: integer}

  - - type: text
      class: notes
      body: |
        **Acute load** is the training load of the last seven days and **chronic load** (dashed)
        your four-week average; staying inside the shaded optimal range builds fitness, well above
        it raises the risk of injury. The word under acute load is Garmin's training status. A
        race prediction that went down in four weeks (a negative change) is faster.

        Readiness, status, loads, VO2 max, endurance and hill scores and race predictions are
        **Garmin's own calculations**. Each part appears once Garmin has worked it out: readiness
        after the first nights, the rest after some weeks of activities.
