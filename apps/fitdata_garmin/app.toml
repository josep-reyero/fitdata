# fitdata-garmin: the app of the fitdata project that archives Garmin data. Its commands are listed
# by `fitdata-garmin --json describe`; AGENTS.md next to this file is its guide for AI agents.

[app]
name = "fitdata-garmin"
title = "Garmin archive"
version = "0.1.0"
command = "fitdata-garmin"         # its console script (pyproject.toml); not a mes.App

[data]
# Its files are under <data folder>/garmin/. Its saved login (.state/) and its log (logs/) are at
# the top of the data folder (a documented exception for this app).
folder = "garmin"
# Never copied into backups: the saved Garmin login. After restoring a backup, log in again.
no_backup = ["data/.state/garmin-tokens.json"]
writes = ["days", "activities"]    # its rows of the project's shared tables
# Its own tables (extract.py): every stored file; Garmin's daily detail (sleep, the day, training)
# and Body Battery events, one row per day or event; the series through the day and the night
# (samples, sleep stages), for the most recent intraday_days days only.
tables = ["garmin_files", "garmin_sleep", "garmin_daily", "garmin_training", "garmin_body_battery_events",
          "garmin_samples", "garmin_sleep_stages"]
rebuild = "index"                  # rebuilds all of the above from the files under garmin/

# The jobs match systemd/*.timer (the standalone way to run them; tests/test_project.py checks they
# match). "--local" keeps a job on this machine even if the config names a remote. Every job only
# talks to Garmin Connect (sign-in refresh and data). `fitdata-garmin login`, which is not a job (a
# person runs it), also reaches mobile.integration.garmin.com during the sign-in itself.
[jobs.activities]
run = "activities-sync --days 2 --local"
schedule = "*:0/10"                      # every 10 minutes: new activities
network = ["connectapi.garmin.com", "connect.garmin.com", "diauth.garmin.com", "sso.garmin.com"]
memory = "512M"
timeout = "20m"

[jobs.today]
run = "sync --days 1 --local"
schedule = "*:05/30"                     # every half hour: today's health data, so the dashboards stay current
network = ["connectapi.garmin.com", "connect.garmin.com", "diauth.garmin.com", "sso.garmin.com"]
memory = "512M"
timeout = "20m"

[jobs.daily]
run = "sync --days 3 --local"
schedule = "*-*-* 07,13,22:30:00"        # 07:30, 13:30 and 22:30: the last 3 days again (late watch syncs, corrections)
network = ["connectapi.garmin.com", "connect.garmin.com", "diauth.garmin.com", "sso.garmin.com"]
memory = "512M"
timeout = "30m"

[jobs.backfill]
run = "backfill --max-days 90 --local"
schedule = "*-*-* 02:15:00"              # nightly: 90 more days of history until it is complete
network = ["connectapi.garmin.com", "connect.garmin.com", "diauth.garmin.com", "sso.garmin.com"]
memory = "512M"
timeout = "3h"                           # about 35 throttled calls per day of history

[ui]
# Whole dashboards, in dashboards/<slug>.yaml. They read the shared views days and activities (so
# another app's days and activities show up in them too) and this app's detail tables below.
dashboards = ["sleep", "health", "workouts"]
tables = ["garmin_sleep", "garmin_daily", "garmin_training", "garmin_body_battery_events", "garmin_samples",
          "garmin_sleep_stages"]

# The Garmin headline readings and the charts of the night and the day on the project's Today page
# (ui/dashboards/overview.yaml).
[ui.contributes.overview]
sections = "dashboards/overview-garmin.yaml"
