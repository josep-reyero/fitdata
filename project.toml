# fitdata as a my-easy-software (mes) project: its app, its jobs and what its dashboards may show.
# The dashboards are in ui/dashboards/ (see ui/README.md). Without mes, the same three jobs run as
# systemd user timers from systemd/ (see README, "Collect").

[project]
name = "fitdata"
title = "Fitness"
version = "0.1.0"

[apps.fitdata]
cli = "fitdata"            # the console script; `fitdata --json describe` lists its commands and kinds

# The jobs match systemd/*.timer. "--local" keeps a job on this machine even if the config names a
# remote. Every job only talks to Garmin Connect (sign-in refresh and data). `fitdata login`, which is
# not a job (a person runs it), also reaches mobile.integration.garmin.com during the sign-in itself.
[jobs.activities]
run = "fitdata activities-sync --days 2 --local"
schedule = "*:0/10"                      # every 10 minutes: new activities
network = ["connectapi.garmin.com", "connect.garmin.com", "diauth.garmin.com", "sso.garmin.com"]
memory = "512M"
timeout = "20m"

[jobs.daily]
run = "fitdata sync --days 3 --local"
schedule = "*-*-* 07,13,22:30:00"        # 07:30, 13:30 and 22:30: the last 3 days' health data
network = ["connectapi.garmin.com", "connect.garmin.com", "diauth.garmin.com", "sso.garmin.com"]
memory = "512M"
timeout = "30m"

[jobs.backfill]
run = "fitdata backfill --max-days 90 --local"
schedule = "*-*-* 02:15:00"              # nightly: 90 more days of history until it is complete
network = ["connectapi.garmin.com", "connect.garmin.com", "diauth.garmin.com", "sso.garmin.com"]
memory = "512M"
timeout = "3h"                           # about 35 throttled calls per day of history

[ui]
# The index fitdata builds (`fitdata index`, and every job), relative to the project's data folder.
# That folder is fitdata's own data_dir; mes and easy-ui find it through
# [projects.fitdata] data_dir in ~/.config/mes/config.toml (see ui/README.md).
data = "fitdata.sqlite"
# Only these tables reach the dashboards. The files table (paths of stored files) stays out.
tables = ["days", "activities"]
accent = "#2a7f62"
# The menu order; the first one (Today) opens when the page starts.
dashboards = ["overview", "sleep", "activities", "trends"]
# Every job rebuilds the index, so the dashboard data is rebuilt after each of them.
refresh_after = ["activities", "daily", "backfill"]

# Optional, only with storage = "bucket" in fitdata's config: the archive's raw and processed files
# then live in a my-bucket-storage bucket (see README, "Storage"). fitdata reads its store location
# from its own config, so this stays commented until mes manages the store for the project.
# [storage]
# bucket = "archive"
