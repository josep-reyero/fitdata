# fitdata as a my-easy-software (mes) project: its apps, the tables they share and its dashboards.
# Each app is a Python package with its own app.toml (its commands, jobs and data); the first one,
# fitdata-garmin, lives in apps/fitdata_garmin/. Without mes, the same three jobs run as systemd user
# timers from systemd/ (see README, "Collect").

[project]
name = "fitdata"
title = "Fitness"
version = "0.1.0"
apps = ["fitdata_garmin"]          # package names; the order decides menus and where sections land

# The shared tables: every app that keeps days or activities writes rows into these, with the same
# columns. Measurements are "number" (kept exactly as Garmin gave them: 144 stays 144, 144.5 stays
# 144.5); "real" would turn every whole number into 144.0. Readers (dashboards, `fitdata sql`,
# agents) read the views "days" and "activities". After changing a table here, regenerate
# apps/fitdata_garmin/schema.sql (apps/fitdata_garmin/AGENTS.md, "Working on the code").

[tables.days]                      # one row per archived day
key = ["date"]
# Rows of several apps for the same day become one row, each value from the first app in this list
# that has one, then the others in apps order.
prefer = ["fitdata-garmin"]
[tables.days.columns]
date = "text"
has_data = "boolean"
complete = "boolean"
fetched_at = "text"
steps = "integer"
distance_m = "number"
calories = "number"
active_calories = "number"
floors_up = "number"
resting_hr = "integer"
min_hr = "integer"
max_hr = "integer"
stress_avg = "integer"
body_battery_high = "integer"
body_battery_low = "integer"
intensity_minutes = "integer"
sleep_seconds = "integer"
sleep_score = "integer"
hrv_last_night_avg = "integer"
hrv_status = "text"
training_readiness = "integer"
vo2max_running = "number"
training_status = "json"
activity_count = "integer"
dir = "text"
# Read from the day's processed files by the index (apps/fitdata_garmin/extract.py). New columns go
# at the end: `mes db sync` adds a missing column after the others.
sleep_start = "text"               # local "YYYY-MM-DD HH:MM" the night's sleep began (stored on the morning's date)
sleep_end = "text"                 # and ended
sleep_deep_seconds = "integer"
sleep_light_seconds = "integer"
sleep_rem_seconds = "integer"
sleep_awake_seconds = "integer"
nap_seconds = "integer"
sleep_hr_avg = "number"            # beats per minute during the night
sleep_respiration_avg = "number"   # breaths per minute during the night
sleep_spo2_avg = "number"          # blood oxygen during the night, percent
skin_temp_deviation_c = "number"   # overnight skin temperature against the person's usual, degrees C
respiration_avg = "number"         # breaths per minute while awake
spo2_avg = "number"
spo2_low = "number"
steps_goal = "integer"
floors_down = "number"
moderate_minutes = "integer"
vigorous_minutes = "integer"
resting_calories = "number"
weight_kg = "number"
bmi = "number"
body_fat_pct = "number"
hydration_ml = "number"
hydration_goal_ml = "number"

[tables.activities]                # one row per activity; every app's activities are kept
key = ["id"]
[tables.activities.columns]
id = "integer"
date = "text"
type = "text"
name = "text"
start_local = "text"
dir = "text"
fit = "text"
parent_type = "integer"
event_type = "text"
start_utc = "text"
duration_s = "number"
moving_s = "number"
elapsed_s = "number"
distance_m = "number"
ascent_m = "number"
descent_m = "number"
avg_hr = "number"
max_hr = "number"
avg_speed_mps = "number"
calories = "number"
aerobic_te = "number"
anaerobic_te = "number"
te_label = "text"
training_load = "number"
vo2max = "number"
avg_power = "number"
avg_cadence = "number"
device = "integer"
location = "text"
fetched_at = "text"
complete = "boolean"
records = "integer"

[ui]
accent = "#2a7f62"
# The menu order; the first one (Today) opens when the page starts. "overview" is the project's own
# (ui/dashboards/), the others come from fitdata-garmin (apps/fitdata_garmin/dashboards/).
dashboards = ["overview", "sleep", "stress", "heart", "activity", "training", "body", "trends"]
# Every job rebuilds the index, so the dashboard data is rebuilt after each of them.
refresh_after = ["fitdata-garmin.activities", "fitdata-garmin.daily", "fitdata-garmin.backfill"]

# Optional, only with storage = "bucket" in fitdata's config: the archive's raw and processed files
# then live in a my-bucket-storage bucket (see README, "Storage"). fitdata reads its store location
# from its own config, so this stays commented until mes manages the store for the project.
# [storage]
# bucket = "archive"
