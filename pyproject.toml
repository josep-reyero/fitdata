[project]
name = "fitdata"
version = "0.1.0"
description = "Your own per-day archive of Garmin data (raw FIT, Garmin's processed metrics, activities) with a CLI for people and AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.20",
    "garmin-fit-sdk>=21.0",
]

[project.optional-dependencies]
# storage = "bucket": keep the archive in a my-bucket-storage bucket (see README, "Storage").
# Not on PyPI, so it is pinned to a commit of its public repository.
bucket = [
    "my-bucket-storage @ git+https://github.com/josep-reyero/my-bucket-storage@9f39c3d939bf9631b9ab909a205d1aaffea20554",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
# The project command: hands each command to the project's apps (README, "Commands").
fitdata = "fitdata_garmin.cli:main"
# The project's one app so far: the Garmin archive.
fitdata-garmin = "fitdata_garmin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the bucket extra above

[tool.hatch.build.targets.wheel]
packages = ["src/fitdata", "apps/fitdata_garmin"]
