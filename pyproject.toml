[project]
name = "fitdata"
version = "0.1.0"
description = "Your own per-day archive of Garmin data (raw FIT, Garmin's processed metrics, activities) with a CLI for people and AI agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.20",
    "garmin-fit-sdk>=21.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
fitdata = "fitdata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitdata"]
