spec: easy-ui/v1
title: Today
description: >-
  How ready you are, how you slept and how the day is going. Each small arrow compares the day
  with your usual: your average over the days before it (up to 28), once there are at least 3.

params:
  day:
    type: date
    label: Day
    default: today

queries:
  # The day this page shows, as one line: the chosen one, or the most recent day with data when
  # the chosen day is later (the watch has not synced yet), from any app of the project; and when
  # that day's data was fetched.
  shown:
    sql: |
      WITH s AS (
        SELECT min(:day, max(date)) AS d FROM days WHERE has_data = 1
      ),
      f AS (
        SELECT s.d, (SELECT max(fetched_at) FROM days WHERE date = s.d) AS at FROM s
      ),
      t AS (
        SELECT f.d, f.at,
               substr('SunMonTueWedThuFriSat', 1 + 3 * strftime('%w', f.d), 3) || ' '
                 || CAST(strftime('%d', f.d) AS INTEGER) || ' '
                 || substr('JanFebMarAprMayJunJulAugSepOctNovDec', 1 + 3 * (strftime('%m', f.d) - 1), 3)
                 || CASE WHEN strftime('%Y', f.d) <> strftime('%Y', :day) THEN ' ' || strftime('%Y', f.d) ELSE '' END
                 AS day_text,
               CAST(strftime('%d', f.at) AS INTEGER) || ' '
                 || substr('JanFebMarAprMayJunJulAugSepOctNovDec', 1 + 3 * (strftime('%m', f.at) - 1), 3) AS at_day
        FROM f
      )
      SELECT CASE
               WHEN t.d IS NULL THEN 'Nothing synced yet: the first sync fills this page.'
               ELSE (CASE WHEN t.d < :day THEN 'Latest day with data: ' ELSE 'Showing ' END) || t.day_text
                    || CASE WHEN t.at IS NULL THEN ''
                            WHEN substr(t.at, 1, 10) = t.d THEN ' · updated ' || substr(t.at, 12, 5)
                            ELSE ' · updated ' || t.at_day || ' ' || substr(t.at, 12, 5) END
             END AS line
      FROM t

layout:
  - - type: controls
    - type: stat
      title: Shown day
      id: shown-day
      class: dayline
      query: shown
      value: line

  # Each app adds what it measures here: fitdata-garmin its readiness, sleep, Body Battery, heart
  # and activity readings (apps/fitdata_garmin/dashboards/overview-garmin.yaml) ...
  - anchor: readings

  # ... and how the night and the day went, hour by hour.
  - anchor: trends
