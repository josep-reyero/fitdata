spec: easy-ui/v1
title: Today
description: >-
  How ready you are, how you slept and how the day is going, each against your own usual.

params:
  day:
    type: date
    label: Day
    default: today

queries:
  # The day this page shows: the chosen one, or the most recent day with data when the chosen day
  # is later (the watch has not synced yet), from any app of the project.
  last_day:
    sql: |
      WITH shown AS (
        SELECT min(:day, max(date)) AS d FROM days WHERE has_data = 1
      )
      SELECT s.d AS day, (SELECT fetched_at FROM days WHERE date = s.d) AS synced
      FROM shown s

layout:
  - - type: controls
  - - type: stat
      title: Showing
      query: last_day
      value: day
      format: date
      hint: The chosen day, or the most recent one with data when the chosen day has not synced yet.
    - type: stat
      title: Updated
      query: last_day
      value: synced
      format: datetime
      hint: When this day's data was last fetched.

  # Each app adds what it measures here: fitdata-garmin its readiness, sleep, Body Battery, heart
  # and activity readings (apps/fitdata_garmin/dashboards/overview-garmin.yaml) ...
  - anchor: readings

  # ... and how the day went, hour by hour.
  - anchor: trends
