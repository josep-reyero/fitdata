spec: easy-ui/v1
title: Today
description: >-
  Your latest readings against your own average before them, and how they have moved lately.

params:
  days:
    type: choice
    label: Days
    default: 30
    options:
      - {value: 7, label: 7 days}
      - {value: 30, label: 30 days}
      - {value: 90, label: 90 days}
      - {value: 365, label: 365 days}

queries:
  # The most recent day with data from any app of the project.
  last_day:
    sql: |
      SELECT max(date) AS day FROM days WHERE has_data = 1

layout:
  - - type: controls
    - type: stat
      title: Data up to
      query: last_day
      value: day
      format: date
      hint: The most recent day with data (for Garmin, the last day the watch synced). Everything on this page ends on this day.

  # Each app adds its readings here (fitdata-garmin: steps, resting heart rate, sleep, HRV, Body
  # Battery and Training Readiness; apps/fitdata_garmin/dashboards/overview-garmin.yaml) ...
  - anchor: readings

  # ... and how they have moved lately.
  - anchor: trends
