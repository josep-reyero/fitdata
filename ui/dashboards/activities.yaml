spec: easy-ui/v1
title: Activities
description: >-
  What you did in the period: how often, how far, how long and how much climbing, week by
  week, with your recent activities. The period ends on the most recent day with data.

params:
  days:
    type: choice
    label: Days
    default: 30
    options:
      - {value: 7, label: 7 days}
      - {value: 30, label: 30 days}
      - {value: 90, label: 90 days}
      - {value: 365, label: 365 days}

queries:
  # Totals for the period and the change against the same number of days before it. The change
  # is left empty when the archive does not reach back that far, so it is never compared with
  # days that were simply not recorded.
  totals:
    sql: |
      WITH end_day AS (
        SELECT max(d) AS d FROM (
          SELECT max(date) AS d FROM days WHERE has_data = 1
          UNION ALL SELECT max(date) FROM activities
        )
      ),
      a AS (
        SELECT CASE WHEN date > date(e.d, '-' || :days || ' days') THEN 1 ELSE 0 END AS recent,
               nullif(distance_m, 0) AS distance_m, duration_s, ascent_m
        FROM activities, end_day e
        WHERE date > date(e.d, '-' || (2 * :days) || ' days') AND date <= e.d
      ),
      covered AS (
        SELECT (SELECT min(date) FROM days WHERE has_data = 1)
                 <= date(e.d, '-' || (2 * :days - 1) || ' days') AS ok
        FROM end_day e
      )
      SELECT
        count(CASE WHEN recent = 1 THEN 1 END) AS count,
        CASE WHEN c.ok THEN count(CASE WHEN recent = 1 THEN 1 END) - count(CASE WHEN recent = 0 THEN 1 END) END
          AS count_change,
        total(CASE WHEN recent = 1 THEN distance_m END) AS distance,
        CASE WHEN c.ok THEN total(CASE WHEN recent = 1 THEN distance_m END) - total(CASE WHEN recent = 0 THEN distance_m END) END
          AS distance_change,
        total(CASE WHEN recent = 1 THEN duration_s END) AS time,
        CASE WHEN c.ok THEN total(CASE WHEN recent = 1 THEN duration_s END) - total(CASE WHEN recent = 0 THEN duration_s END) END
          AS time_change,
        total(CASE WHEN recent = 1 THEN ascent_m END) AS ascent,
        CASE WHEN c.ok THEN total(CASE WHEN recent = 1 THEN ascent_m END) - total(CASE WHEN recent = 0 THEN ascent_m END) END
          AS ascent_change
      FROM covered c LEFT JOIN a ON 1 = 1

  # Every week (Monday to Sunday) in the period, including weeks without any activity.
  weekly:
    sql: |
      WITH RECURSIVE end_day AS (
        SELECT max(d) AS d FROM (
          SELECT max(date) AS d FROM days WHERE has_data = 1
          UNION ALL SELECT max(date) FROM activities
        )
      ),
      weeks(week) AS (
        -- From the first week of the period, or of the archive when it starts later.
        SELECT date(max(date(e.d, '-' || (:days - 1) || ' days'),
                        (SELECT min(date) FROM days WHERE has_data = 1)), 'weekday 0', '-6 days')
        FROM end_day e
        UNION ALL
        SELECT date(week, '+7 days') FROM weeks, end_day e WHERE date(week, '+7 days') <= e.d
      ),
      a AS (
        SELECT date(date, 'weekday 0', '-6 days') AS week,
               CASE
                 WHEN type LIKE '%running%' THEN 'run'
                 WHEN type LIKE '%cycling%' OR type LIKE '%biking%' OR type LIKE '%ride%' THEN 'ride'
                 WHEN type LIKE '%walking%' OR type LIKE '%hiking%' THEN 'walk'
                 ELSE 'other'
               END AS sport,
               nullif(distance_m, 0) AS distance_m, duration_s
        FROM activities, end_day e
        WHERE date > date(e.d, '-' || :days || ' days') AND date <= e.d
      )
      SELECT w.week AS week,
             round(total(CASE WHEN a.sport = 'run' THEN a.distance_m END) / 1000, 1) AS "Running distance",
             round(total(CASE WHEN a.sport = 'ride' THEN a.distance_m END) / 1000, 1) AS "Cycling distance",
             round(total(CASE WHEN a.sport = 'walk' THEN a.distance_m END) / 1000, 1) AS "Walking and hiking distance",
             round(total(CASE WHEN a.sport = 'run' THEN a.duration_s END) / 3600, 1) AS "Running",
             round(total(CASE WHEN a.sport = 'ride' THEN a.duration_s END) / 3600, 1) AS "Cycling",
             round(total(CASE WHEN a.sport = 'walk' THEN a.duration_s END) / 3600, 1) AS "Walking and hiking",
             round(total(CASE WHEN a.sport = 'other' THEN a.duration_s END) / 3600, 1) AS "Other"
      FROM weeks w LEFT JOIN a ON a.week = w.week
      GROUP BY w.week
      ORDER BY w.week

  # Newest first. Pace is only worked out for runs; distance 0 (strength, indoor) shows as a dash.
  recent:
    sql: |
      WITH end_day AS (
        SELECT max(d) AS d FROM (
          SELECT max(date) AS d FROM days WHERE has_data = 1
          UNION ALL SELECT max(date) FROM activities
        )
      )
      SELECT date AS day,
             upper(substr(replace(coalesce(type, 'activity'), '_', ' '), 1, 1))
               || substr(replace(coalesce(type, 'activity'), '_', ' '), 2) AS kind,
             name,
             nullif(distance_m, 0) AS distance,
             duration_s AS duration,
             CASE WHEN type LIKE '%running%' AND distance_m > 0
                  THEN coalesce(moving_s, duration_s) * 1000.0 / distance_m END AS pace,
             ascent_m AS ascent,
             avg_hr,
             aerobic_te
      FROM activities, end_day e
      WHERE date > date(e.d, '-' || :days || ' days') AND date <= e.d
      ORDER BY start_local DESC, id DESC

layout:
  - - type: controls

  - - type: stat
      title: Activities
      query: totals
      value: count
      format: integer
      delta: count_change
      hint: How many you recorded, against the same number of days before.
    - type: stat
      title: Distance
      query: totals
      value: distance
      format: distance
      delta: distance_change
      hint: All activities together.
    - type: stat
      title: Time
      query: totals
      value: time
      format: duration
      delta: time_change
      hint: Hours and minutes of activity.
    - type: stat
      title: Climbing
      query: totals
      value: ascent
      format: integer
      delta: ascent_change
      hint: Metres of ascent.

  - - type: bar
      title: Distance per week
      query: weekly
      x: week
      y: ["Running distance", "Cycling distance", "Walking and hiking distance"]
      format: decimal1
      unit: km
      stacked: true
    - type: bar
      title: Time per week
      query: weekly
      x: week
      y: [Running, Cycling, Walking and hiking, Other]
      format: decimal1
      unit: h
      stacked: true

  - - type: table
      title: Recent activities
      query: recent
      limit: 50
      columns:
        - {column: day, label: Date, format: date}
        - {column: kind, label: Type}
        - {column: name, label: Name}
        - {column: distance, label: Distance, format: distance}
        - {column: duration, label: Time, format: duration}
        - {column: pace, label: Pace, format: pace}
        - {column: ascent, label: Ascent (m), format: integer}
        - {column: avg_hr, label: Avg HR (bpm), format: integer}
        - {column: aerobic_te, label: Training effect, format: decimal1}

  - - type: text
      body: |
        Weeks run from Monday to Sunday; the first week of the period may be only partly
        included. A dash means the watch did not record that value, for example no distance
        for a strength session.

        **Training effect** is Garmin's own score from 0 to 5 for how much an activity improved
        your aerobic fitness: below 2 is easy recovery, 3 to 4 improves fitness, above 4 is very hard.
